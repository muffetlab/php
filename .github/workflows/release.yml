name: release

# Publishes reviewed images to the registry (GHCR by default, optional
# Docker Hub mirror when DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets exist).
#
# Published image: ghcr.io/muffetlab/php (registry + namespace inputs, image
# name "php"). The namespace is the GHCR owner, so a fork overrides it with its
# own GitHub user/org.
#
# Four roles, kept deliberately apart -- this is the whole release model, and it
# is what lets a new PHP series join without touching the pipeline:
#   - A git tag marks a SOURCE RELEASE: vMAJOR.MINOR.PATCH (v1.0.0). It selects
#     no PHP version, carries no build number, and contributes nothing to an image
#     name. Its one job is to answer "which commit of this repository is official
#     source", and this workflow requires the commit it publishes from to carry
#     one -- see the guard job.
#   - This Actions workflow input chooses the SCOPE: version is one PHP series
#     (8.1) or all (every supported series, in this one run), and revision is the
#     image revision (r1, r2, ...). There is exactly one release entry point and
#     one release workflow; adding PHP 8.2, 8.3 or a dozen legacy lines adds a
#     manifest, not a workflow.
#   - manifests/<series>.env holds the PHP VERSION itself (SOURCE_REF, e.g.
#     8.1.34) together with the base-image and php-src pins. The published exact
#     name is composed from the version the image was actually built at, never
#     from a tag name.
#   - Docker tags express the RESULT: php:<minor>-<variant> (8.1-fpm) floats to
#     the newest build of that series, and php:<full>-r<revision>-<variant>
#     (8.1.34-r1-fpm) is an immutable snapshot of one build.
#
# Trigger: workflow_dispatch from the default branch (main or master) and nothing
# else. A tag push cannot carry a scope, so publishing has one entry point -- the
# dispatch below -- and pushing a tag starts no build. Because every publishing run
# is a dispatch on the branch ref, the concurrency group below makes two releases
# queue instead of racing, whatever series each names.
#
# What a run publishes: the exact <full>-r<revision>-<variant> name composed from
# the PHP version the image reports, plus the floating <minor>-<variant> name. An
# OS security update that does not move the PHP pin bumps the revision (r1 -> r2)
# and publishes beside the old snapshot rather than over it. Nothing here counts
# builds by asking the registry, and no run writes a latest tag -- see below.
#
# Safety model:
#   - No :latest-<variant>, and no plain :latest either. A run publishes the series
#     it selects, so "latest" would resolve to whichever series was released last
#     -- not the newest PHP, not a recommendation, and it could move 8.1 -> 7.4 on
#     an unrelated rebuild. <minor>-<variant> is the only floating name, and it
#     cannot change the major version.
#   - Re-runs the same static validate gate as CI (manifest policy + patch
#     SHA-256 vs review records).
#   - Every selected version's manifest must itself be release-ready: validate
#     refuses a run whose selected series is unfilled or not PATCHSET_APPROVED=1,
#     and refuses a run that selected nothing, rather than finishing green with
#     nothing published. build-version.yml still skips any manifest that is
#     unfilled or unapproved, so a release only publishes what humans have
#     reviewed; it never lowers a gate.
#   - build-version.yml builds and tests each variant natively on linux/amd64
#     and linux/arm64, pushes the per-arch images by digest, and merges them into
#     one multi-arch manifest list per tag, so every published name resolves on
#     both architectures.
#   - build-version.yml independently refuses push unless github.ref is the branch
#     it accepts (main or master) *and* source_release names a tagged source
#     release (vMAJOR.MINOR.PATCH), and only release.yml passes push=true -- so
#     the requirement that published images come from tagged source is enforced
#     both where the scope is chosen and where the registry is written.
#   - A run publishes the series it selects: one series for a version=8.1 dispatch,
#     every supported series for version=all, in one run, as one dynamic matrix of
#     build jobs. The series a run does not select stay on their previous build,
#     including their previous base digest, until a later run selects them. Doing
#     a full release in one run is also what makes the SUPPORTED.md gate honest:
#     it reads the live registry once, in validate, before any of the matrix legs
#     can push, so the check describes the state the release departs from.
#   - One Docker Hub Overview sync per run, from the mirror-readme job, because the
#     Overview is one piece of metadata for the whole <user>/php repository: eight
#     matrix legs would otherwise PATCH the same document eight times and report one
#     release as eight.

on:
  # Dispatch only, and only from the default branch (the guard job below enforces
  # that, because workflow_dispatch has no branch filter). A git tag push cannot
  # carry the scope inputs, so tags mark source releases and start no build.
  workflow_dispatch:
    inputs:
      version:
        # One PHP series (8.1) or the literal all (every supported series, in this
        # one run). A free string rather than a `choice` menu on purpose: a menu
        # would repeat SUPPORTED_VERSIONS here and drift from it, and adding PHP 8.2
        # should cost a manifest, not an edit to the release pipeline.
        description: "PHP series to release (e.g. 8.1), or all for every supported series"
        type: string
        required: true
        default: "8.1"
      revision:
        # The image revision, written into the immutable name as -r<N>: that is
        # 8.1.34-r1-fpm, and the next fix on the same PHP pin is 8.1.34-r2-fpm
        # published beside it. Asked for rather than derived from the registry,
        # because two runs each concluding "I am r1" would fight over one published
        # name. Required and always positive: every exact name carries a revision,
        # so there is no bare <full>-<variant> name for a rebuild to overwrite. One
        # number per run, shared by every series an all-run publishes, which is what
        # makes r2 a single release of this kit rather than eight unrelated builds.
        description: "Image revision number (1 = first build of the PHP version in the manifests, 2 = the next fix; applies to every series in this run)"
        type: string
        required: true
        default: "1"
      namespace:
        description: "GHCR owner/namespace that hosts the php image (default: muffetlab)"
        type: string
        default: "muffetlab"
      attestations:
        # With no tag-triggered path left, the checkbox is the whole decision: a
        # dispatch that unchecks it gets no attestations, and the release job passes
        # the value through to every matrix leg.
        description: "Attach provenance/SBOM attestations"
        type: boolean
        default: true

concurrency:
  # Every publishing run is a dispatch on the default branch, so they all land in
  # one group and queue instead of racing -- which covers the case the old
  # tag-per-series model could not: a version=all run and a single-series dispatch
  # can both move the same <minor>-<variant> name, and on separate refs nothing
  # would have stopped them. Releases of different series therefore queue behind
  # each other too; that is the cheap price of never having two runs fight over one
  # floating name.
  # cancel-in-progress stays false: a release cancelled mid-publish leaves some
  # tags written and some not, and a queued release is the better failure.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPPORTED_VERSIONS: "5.6 7.0 7.1 7.2 7.3 7.4 8.0 8.1"

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # The source release being published -- the git tag that points at the commit
      # this run is dispatching from (vMAJOR.MINOR.PATCH). A git tag marks source; it
      # selects no PHP version, carries no image revision, and appears nowhere in a
      # published name. It is here because publishing from untagged source is refused,
      # so every image in the registry answers "which reviewed commit is this".
      release: ${{ steps.srctag.outputs.release }}
      # The PHP series this run publishes, as the comma-padded list the release matrix
      # is built from: ",8.1," for version=8.1, and ",5.6,7.0,...,8.1," for version=all.
      # Padded on both sides so one series can never match inside another the way a
      # bare substring search would -- ",8.1," is not inside ",8.10,". Empty selects
      # nothing, and the readiness step below treats that as a failure instead of
      # letting the run go green with an empty matrix.
      selected: ${{ steps.dispatch.outputs.selected }}
      # The image revision every published exact name carries: php:<full>-r<N>-<variant>.
      revision: ${{ steps.dispatch.outputs.revision }}
    steps:
      - name: Release allowed only from the default branch
        # Not just a branch rule any more: with no tag-push path, a run that was not
        # dispatched from the default branch has no business holding registry
        # credentials whatever its ref looks like.
        if: github.event_name != 'workflow_dispatch' || !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          echo "::error::release runs only from a workflow_dispatch on main or master (a git tag marks source and publishes nothing by itself)"
          exit 1

      - uses: actions/checkout@v7
        with:
          # Every tag and every commit, because the step below asks whether *this
          # commit* carries a source release tag. A shallow branch checkout has the
          # commit but not the tag refs that point at it, and that would make a
          # correctly tagged release look untagged.
          fetch-depth: 0

      - name: Source release tag check
        id: srctag
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # A git tag marks a source release. It does not name a PHP version, does not
          # carry the image revision, and contributes nothing to an image name -- which
          # is exactly why one tag can cover a release of eight series: the scope came
          # from the workflow input, and the tag is left alone to do the one thing it
          # is good at, recording which commit of this repository is official source.
          # Tags are still never moved, so the namespace stays an append-only history
          # of source releases. What it no longer claims to be is a history of builds:
          # that is the registry's -r<N> namespace, and SUPPORTED.md reads it live.
          # grep with no match would end the step on its exit status, so || true keeps
          # the empty answer on the path that prints the real message.
          tags="$(git tag --points-at "$SHA" | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V)"
          if [ -z "$tags" ]; then
            echo "::error::commit $(printf '%.10s' "$SHA") carries no source release tag (expected vMAJOR.MINOR.PATCH, e.g. git tag v1.0.0 && git push origin v1.0.0); refusing to publish an image whose source is not a tagged release"
            exit 1
          fi
          count="$(printf '%s\n' "$tags" | wc -l | tr -d ' ')"
          # Two release tags on one commit is legal but ambiguous. Publish under the
          # highest rather than whichever git happens to list first, and say so -- the
          # commit is the same either way, so this changes only the label.
          release="$(printf '%s\n' "$tags" | tail -1)"
          if [ "$count" != 1 ]; then
            echo "Notice: ${count} source release tags point at this commit ($(printf '%s\n' "$tags" | tr '\n' ' ')); publishing under ${release}"
          fi
          echo "Publishing source release ${release} at commit $(printf '%.10s' "$SHA"), on $(git log -1 --format=%s)"
          echo "release=${release}" >> "$GITHUB_OUTPUT"

      # A free string rather than a `choice` input: a choice list would repeat the
      # supported series here and drift from SUPPORTED_VERSIONS (the same list
      # build.sh and manifests/*.env agree with). A typo costs a five-second guard
      # failure, which is the point of checking it before validate.
      - name: Release scope check
        id: dispatch
        env:
          VERSION_INPUT: ${{ inputs.version }}
          REVISION_INPUT: ${{ inputs.revision }}
        run: |
          set -eu
          series="$(printf '%s' "$VERSION_INPUT" | tr 'A-Z' 'a-z')"
          # The image revision is mandatory, because it is part of every published
          # exact name: <full>-r<N>-<variant>. Asking rather than deriving it from the
          # registry is deliberate -- two runs each concluding "I am r1" would fight
          # over one published name -- and requiring it is what removes the old
          # failure mode where a rebuild with no number republished the bare name over
          # the snapshot the number exists to protect.
          rev="$REVISION_INPUT"
          if ! printf '%s' "$rev" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::revision '$rev' is not an image revision (expected a positive integer such as 1; published names are <php>-r<revision>-<variant>)"
            exit 1
          fi
          # "all" is a formally supported value, not a convenience: it selects every
          # supported series in this one run, so a full release is one validate, one
          # matrix, one Overview sync -- and one read of the live registry by the
          # SUPPORTED.md gate, which is the documentation check that cannot be true
          # across eight separate runs (each later run reads digests another run
          # wrote). It is also the reason this workflow needs no per-version release
          # file: a new PHP series joins by adding a manifest and a SUPPORTED_VERSIONS
          # row, and `all` starts publishing it with no pipeline edit.
          if [ "$series" = "all" ]; then
            # Comma-padded list of every supported series; the plan job turns it into
            # the matrix this run builds.
            selected=",$(printf '%s' "$SUPPORTED_VERSIONS" | tr ' ' ','),"
            echo "Release scope: every supported PHP series ($SUPPORTED_VERSIONS), image revision r$rev"
            echo "selected=$selected" >> "$GITHUB_OUTPUT"
            echo "revision=$rev" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$series" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "::error::version '$series' is not a PHP series (expected <major>.<minor>, e.g. 5.6, or all for every supported series)"
            exit 1
          fi
          case " $SUPPORTED_VERSIONS " in
            *" $series "*) ;;
            *)
              echo "::error::version '$series' names PHP series '$series', which is not supported (supported: $SUPPORTED_VERSIONS)"
              exit 1 ;;
          esac
          echo "Release scope: PHP series $series, image revision r$rev"
          echo "selected=,$series," >> "$GITHUB_OUTPUT"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

  validate:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Shellcheck scripts
        run: |
          # Glob, do not enumerate: a new script must be linted without anyone
          # remembering to add it to a list in three workflows.
          mapfile -t files < <(find . -name '*.sh' -not -path './.git/*' | sort)
          printf 'shellcheck: %s\n' "${files[@]}"
          shellcheck -x "${files[@]}"

      - name: Bash syntax check
        run: |
          mapfile -t files < <(find . -name '*.sh' -not -path './.git/*' | sort)
          bash -n "${files[@]}"

      - name: Dockerfile RUN shell syntax
        run: ./tools/lint-dockerfile-shells.sh

      - name: Verify-script harness
        run: |
          ./tests/verify-harness.sh

      # Same reason as in build-and-verify.yml, and more important here: this is the
      # gate in front of a push. A run whose OS gate never scanned must not be able to
      # reach the registry looking like a clean one.
      - name: OS gate verdict harness
        run: |
          ./tests/scan-image-harness.sh

      - name: Version-branch inventory in sync
        run: |
          ./tools/list-version-branches.sh
          ./tools/list-version-branches.sh --check

      # Same gate as build-and-verify.yml: this is the workflow that publishes,
      # so the extension baseline copies are re-checked here rather than relying
      # on the PR run having happened.
      - name: Extension baseline copies in sync
        run: ./tools/check-ext-baseline.sh --check

      # Same reasoning as build-and-verify.yml, and the same reason this workflow
      # needs it at all: the merge job publishes an Overview as part of a release,
      # and a release cannot be un-published cleanly. Checking the payload builder
      # here means the release that writes the text has already run the assertions
      # about that text, on the same runner image.
      - name: Docker Hub README sync self-test
        run: ./tools/sync-dockerhub-readme.sh --self-test

      - name: Manifest policy check
        run: |
          set -eu
          fail=0
          err() { echo "::error::$*"; fail=1; }
          for v in $SUPPORTED_VERSIONS; do
            [ -f "manifests/$v.env" ] || err "missing manifests/$v.env"
          done
          for f in manifests/*.env; do
            ver="$(basename "$f" .env)"
            case " $SUPPORTED_VERSIONS " in
              *" $ver "*) ;;
              *) err "$f: version not in supported list"; continue ;;
            esac
            # Trusted project config, not untrusted input.
            # shellcheck source=/dev/null
            . "./$f"
            case "${OPENSSL_ROUTE:-}" in openssl11|openssl3) ;; *) err "$f: bad OPENSSL_ROUTE" ;; esac
            if [ "$ver" = "5.6" ] && [ "${OPENSSL_ROUTE:-}" != "openssl11" ]; then
              err "$f: 5.6 requires openssl11"
            fi
            if [ "$ver" != "5.6" ] && [ "${OPENSSL_ROUTE:-}" != "openssl3" ]; then
              err "$f: $ver requires openssl3"
            fi
            # Source of record for every series is the backports fork: the
            # official php/php-src tree ships no security fixes for an EOL line.
            # Moving a manifest to official php-src is a reviewed change to this
            # policy, to build.sh and to the Dockerfile guard -- not a manifest edit.
            case "${PHP_SRC_REPO:-}" in
              *php-src-backports*) ;;
              "") err "$f: PHP_SRC_REPO unset" ;;
              *) err "$f: PHP_SRC_REPO must be shivammathur/php-src-backports (got '${PHP_SRC_REPO:-}')" ;;
            esac
            if ! printf '%s' "${PHP_SRC_COMMIT:-}" | grep -Eq '^[0-9a-f]{40}$'; then
              err "$f: PHP_SRC_COMMIT must be a full 40-character commit SHA"
            fi
            # "@sha256:" alone is not a pin: an unfilled manifest ships
            # "@sha256:REPLACE_WITH_DIGEST". Require 64 hex, but report it as an
            # unready manifest (build jobs skip it) rather than a validate failure.
            case "${BASE_IMAGE:-}" in
              *@sha256:*)
                digest="${BASE_IMAGE##*@sha256:}"
                if ! printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$'; then
                  case "$digest" in
                    REPLACE_WITH*)
                      echo "::warning::$f: BASE_IMAGE digest is still a placeholder; run tools/resolve-base-digest.sh in CI and fill it before this version builds" ;;
                    *)
                      echo "::warning::$f: BASE_IMAGE digest '${digest}' is not 64 lowercase hex -- this manifest is not buildable yet (run tools/resolve-base-digest.sh in CI)" ;;
                  esac
                fi
                ;;
              "") err "$f: BASE_IMAGE unset" ;;
              *) err "$f: BASE_IMAGE must be pinned by digest (repo@sha256:<64 hex>)" ;;
            esac
            variants="${BUILD_VARIANTS:-}"
            [ -n "$variants" ] || err "$f: BUILD_VARIANTS empty"
            for vv in $variants; do
              case "$vv" in cli|fpm) ;; *) err "$f: bad BUILD_VARIANTS entry '$vv'" ;; esac
            done
            case "${PATCHSET_APPROVED:-}" in 0|1) ;; *) err "$f: PATCHSET_APPROVED must be 0 or 1" ;; esac
            # apt lists are interpolated unquoted into apt-get inside the image
            # build, so they must be plain Debian package specifications
            # (name[:arch][=version]) -- same rule build.sh enforces.
            pkg_re='^[A-Za-z0-9][A-Za-z0-9.+-]*(:[A-Za-z0-9.+-]+)?(=[A-Za-z0-9.+:~-]+)?$'
            for plist in BUILD_PACKAGES RUNTIME_PACKAGES; do
              eval "plistval=\${$plist:-}"
              # shellcheck disable=SC2086
              for tok in $plistval; do
                printf '%s' "$tok" | grep -Eq "$pkg_re" \
                  || err "$f: $plist contains an invalid package specification '$tok'"
              done
            done
            # 1 = ship the configured source tree (official-image parity),
            # 0 = omit it to keep the image small. Only those two are valid.
            case "${SHIP_PHP_SOURCE:-1}" in 0|1) ;; *) err "$f: SHIP_PHP_SOURCE must be 0 or 1" ;; esac
            # PHP_EXTENSIONS / PECL_EXTENSIONS add to the kit baseline and are
            # interpolated unquoted into build-stage shell, so they get the same
            # kind of shape check as the apt lists (an extension name is
            # [a-z0-9_]). Which names a series can build at all is the
            # Dockerfile's availability table -- deliberately not duplicated here.
            ext_re='^[a-z0-9_]+$'
            for elist in PHP_EXTENSIONS PECL_EXTENSIONS; do
              eval "elistval=\${$elist:-}"
              # shellcheck disable=SC2086
              for tok in $elistval; do
                printf '%s' "$tok" | grep -Eq "$ext_re" \
                  || err "$f: $elist contains an invalid extension name '$tok'"
              done
            done
            # Optional Composer overrides must respect the series policy.
            cv="${COMPOSER_VERSION:-}"
            cs="${COMPOSER_SHA256:-}"
            case "$ver" in 5.6|7.0|7.1) policy_cv="1.10.28" ;; *) policy_cv="2.11.0" ;; esac
            if [ -n "$cv" ]; then
              if ! printf '%s' "$cv" | grep -Eq '^(1\.10|2)(\.[0-9]+)+$'; then
                err "$f: COMPOSER_VERSION must be an exact 1.10.x or 2.x release (got '$cv')"
              fi
              case "$ver:$cv" in
                5.6:2.*|7.0:2.*|7.1:2.*)
                  err "$f: PHP $ver cannot run Composer 2.x (requires PHP >= 7.2.5)" ;;
              esac
              if [ -z "$cs" ] && [ "$cv" != "$policy_cv" ]; then
                echo "::warning::$f: COMPOSER_VERSION=$cv overrides the policy pin without COMPOSER_SHA256"
              fi
            fi
            if [ -n "$cs" ] && ! printf '%s' "$cs" | grep -Eq '^[0-9a-f]{64}$'; then
              err "$f: COMPOSER_SHA256 must be 64 lowercase hex chars"
            fi
          done
          [ "$fail" = 0 ]

      - name: Composer pins in sync
        run: |
          set -eu
          fail=0
          err() { echo "::error::$*"; fail=1; }
          legacy_pin="$(sed -n 's/.*policy_ver="\(1\.10\.[0-9]*\)".*/\1/p' Dockerfile | head -1)"
          modern_pin="$(sed -n 's/.*policy_ver="\(2\.[0-9.]*\)".*/\1/p' Dockerfile | head -1)"
          [ -n "$legacy_pin" ] || err "Dockerfile: legacy Composer pin not found"
          [ -n "$modern_pin" ] || err "Dockerfile: modern Composer pin not found"
          for f in build.sh .github/workflows/build-version.yml tools/gen-supported.sh README.md MAINTAINING.md SUPPORTED.md; do
            grep -Fq "$legacy_pin" "$f" || err "$f: missing Composer pin $legacy_pin"
            grep -Fq "$modern_pin" "$f" || err "$f: missing Composer pin $modern_pin"
          done
          [ "$fail" = 0 ]

      - name: Published image address in sync
        run: ./tools/check-image-name.sh

      - name: Vendored docker-php-ext hash check
        run: |
          set -eu
          (cd docker-php-ext && shasum -a 256 -c SHA256SUMS)
          dockerfile_sha="$(sed -n 's/^ENV DOCKER_PHP_EXT_SRC_COMMIT=\([0-9a-f]\{40\}\)$/\1/p' Dockerfile)"
          [ -n "$dockerfile_sha" ] || { echo "::error::DOCKER_PHP_EXT_SRC_COMMIT pin not found in Dockerfile"; exit 1; }
          grep -q "$dockerfile_sha" docker-php-ext/README.md || {
            echo "::error::Dockerfile pin $dockerfile_sha not recorded in docker-php-ext/README.md"; exit 1; }

      - name: Patch review record check
        run: |
          set -eu
          fail=0
          err() { echo "::error::$*"; fail=1; }
          for dir in patches/*/; do
            [ -d "$dir" ] || continue
            ver="$(basename "$dir")"
            case " $SUPPORTED_VERSIONS " in
              *" $ver "*) ;;
              *) err "$dir: unsupported version directory"; continue ;;
            esac
            for p in "$dir"*.patch; do
              [ -e "$p" ] || continue
              rec=""
              for r in "$dir"REVIEW-*.md; do
                [ -e "$r" ] || continue
                if grep -Fqi "$(basename "$p")" "$r"; then rec="$r"; break; fi
              done
              if [ -z "$rec" ]; then
                err "$p: no review record (REVIEW-*.md referencing this file)"
                continue
              fi
              hash="$(sha256sum "$p" | awk '{print $1}')"
              if ! grep -Fq "$hash" "$rec"; then
                err "$p: SHA-256 $hash not recorded in $rec"
              fi
            done
          done
          [ "$fail" = 0 ]

      - name: SUPPORTED.md up to date
        run: |
          ./tools/gen-supported.sh
          # The generation-time stamp line advances on every run, so the
          # comparison excludes it rather than failing on its own freshness.
          if ! git diff --quiet --ignore-matching-lines='^<!-- generated at ' -- SUPPORTED.md; then
            echo "::error::SUPPORTED.md is stale; run tools/gen-supported.sh and commit"
            git diff --ignore-matching-lines='^<!-- generated at ' -- SUPPORTED.md
            exit 1
          fi

      # Every series this run publishes, not "any of them": an unreviewed or
      # unfilled manifest has to fail the run instead of going green with no
      # image published. For a version=all run that reading is deliberately
      # strict -- a "full release" that published six series and skipped two is
      # worse than one that never started, and the skipped series would still
      # have had its floating tag repointed by nothing. The same fields
      # build-version.yml checks before it will start a build.
      - name: Selected series are release-ready
        env:
          SELECTED: ${{ needs.guard.outputs.selected }}
        run: |
          set -eu
          [ -n "$SELECTED" ] || { echo "::error::guard selected no PHP series"; exit 1; }
          # ",5.6,7.0," -> the words 5.6 and 7.0. The comma padding leaves empty
          # fields, which word splitting drops; set -f keeps a malformed value
          # from globbing against the working tree.
          set -f
          # shellcheck disable=SC2086  # splitting the padded list is the point
          set -- $(printf '%s' "$SELECTED" | tr ',' ' ')
          set +f
          # A list of nothing but separators. The guard cannot emit one today,
          # but this step is the last place that knows what the run is supposed
          # to publish, so it is the place to refuse: an empty loop below prints
          # "release-ready" for zero series and the run would finish green with
          # every build job skipped by its own gate.
          [ "$#" -gt 0 ] || {
            echo "::error::guard selected no PHP series to publish ('$SELECTED'); refusing to finish green with nothing published"; exit 1; }
          for SERIES in "$@"; do
            printf '%s' "$SERIES" | grep -Eq '^[0-9]+\.[0-9]+$' || {
              echo "::error::guard produced an invalid series '$SERIES'"; exit 1; }
            [ -f "manifests/$SERIES.env" ] || {
              echo "::error::manifests/$SERIES.env is missing"; exit 1; }
            # Cleared before sourcing so a manifest that omits a field cannot
            # inherit the previous series' answer and read as ready.
            unset BASE_IMAGE SOURCE_REF PHP_SRC_COMMIT PATCHSET_APPROVED
            # Trusted project config, not untrusted input.
            # shellcheck source=/dev/null
            . "manifests/$SERIES.env"
            unready=""
            for var in BASE_IMAGE SOURCE_REF PHP_SRC_COMMIT; do
              eval "val=\${$var:-}"
              case "$val" in ""|*REPLACE_WITH*) unready="${unready} ${var}" ;; esac
            done
            # "@sha256:" alone is not a pin: the placeholder text has to be 64 hex.
            case "${BASE_IMAGE:-}" in
              *@sha256:*)
                printf '%s' "${BASE_IMAGE##*@sha256:}" | grep -Eq '^[0-9a-f]{64}$' \
                  || unready="${unready} BASE_IMAGE-digest" ;;
              *) unready="${unready} BASE_IMAGE-pin" ;;
            esac
            [ "${PATCHSET_APPROVED:-0}" = "1" ] || unready="${unready} PATCHSET_APPROVED"
            if [ -n "$unready" ]; then
              echo "::error::PHP series $SERIES is not release-ready (unset or placeholder:${unready}); refusing to run an incomplete release"
              exit 1
            fi
            echo "PHP series $SERIES is release-ready; publishing its declared variants ($(sed -n 's/^BUILD_VARIANTS="\(.*\)"/\1/p' "manifests/$SERIES.env"))"
          done
          echo "Selected series are release-ready: $*"

  # --- One run, one dynamic matrix, one entry point --------------------------
  # The scope the guard chose -- one series, or all of them -- becomes a matrix here
  # instead of eight hand-written jobs. That is the payoff of separating the git tag
  # from the build scope: adding PHP 8.2, 8.3 or another legacy line costs a manifest
  # and a SUPPORTED_VERSIONS row, and version=all starts publishing it with nothing in
  # this file edited. Eight static release-<series> jobs could not say that; each new
  # series would need a new job, a new gate token, and a new assertion in
  # tools/check-image-name.sh to keep the pair honest.
  #
  # plan turns the comma-padded selection into JSON; release calls the reusable build
  # workflow once per entry. fail-fast is off on purpose -- one series' build failure
  # must not cancel the healthy siblings that already have fixes to publish. Within one
  # leg, build-version.yml still covers cli + fpm on amd64 and arm64, so "one series"
  # is never "one image".
  #
  # No caller here passes base_image_override: a release builds on the manifest's
  # reviewed BASE_IMAGE and nothing else, and build-version.yml fails the run if
  # push=true ever arrives together with an override, so a trial cannot publish even
  # through a future caller that forgot the rule.
  plan:
    needs: [guard, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # JSON array, one object per selected series. `php` is the manifest's SOURCE_REF
      # -- the PHP version the *configuration* says this series is, not a tag and not
      # an input -- carried into the matrix so the run log names the versions being
      # published, and `variants` so it names what each series will publish.
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the release matrix from the selected series
        id: matrix
        env:
          SELECTED: ${{ needs.guard.outputs.selected }}
        run: |
          set -eu
          # ",5.6,7.0," -> the words 5.6 and 7.0. The comma padding leaves empty
          # fields, which word splitting drops; set -f keeps a malformed value from
          # globbing against the working tree.
          set -f
          # shellcheck disable=SC2086  # splitting the padded list is the point
          set -- $(printf '%s' "$SELECTED" | tr ',' ' ')
          set +f
          # validate's readiness step already refused an empty selection, so this is
          # the second lock: a matrix of zero entries would run no build job at all,
          # every later job would read it as skipped, and the run would still look
          # like a release that published nothing.
          [ "$#" -gt 0 ] || {
            echo "::error::no PHP series was selected (guard emitted '${SELECTED:-<empty>}'); refusing to build an empty release matrix"
            exit 1
          }
          json="["
          first=1
          for series in "$@"; do
            # Read from the manifest rather than trusting the input, so the version in
            # the published name has one source: the reviewed config.
            php="$(sed -n 's/^SOURCE_REF="\(.*\)"/\1/p' "manifests/${series}.env")"
            [ -n "$php" ] || {
              echo "::error::manifests/${series}.env has no SOURCE_REF; the PHP version must come from the manifest, not from a tag or an input"
              exit 1
            }
            variants="$(sed -n 's/^BUILD_VARIANTS="\(.*\)"/\1/p' "manifests/${series}.env")"
            [ -n "$variants" ] || {
              echo "::error::manifests/${series}.env declares no BUILD_VARIANTS"; exit 1
            }
            entry="$(printf '{"series":"%s","php":"%s","variants":"%s"}' "$series" "$php" "$variants")"
            if [ "$first" = 1 ]; then
              json="${json}${entry}"; first=0
            else
              json="${json},${entry}"
            fi
            echo "Release leg: PHP ${series} -> ${php} (${variants})"
          done
          json="${json}]"
          printf 'matrix=%s\n' "$json" >> "$GITHUB_OUTPUT"
          echo "Selected series: $* ($# of $(printf '%s' "$SUPPORTED_VERSIONS" | wc -w | tr -d ' ') supported)"

  release:
    needs: [guard, validate, plan]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-version.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version: ${{ matrix.series }}
      push: true
      # The image revision every published exact name carries
      # (<php>-r<revision>-<variant>). It comes from the dispatch input rather than a
      # tag, and every series in this run shares it -- which is what makes r2 one
      # release of this kit instead of eight unrelated rebuilds.
      revision: ${{ needs.guard.outputs.revision }}
      # The git tag of the source being published. The guard above required the
      # dispatched commit to carry it, and build-version.yml refuses push=true without
      # it, so publishing from untagged source is blocked at both ends of the call.
      source_release: ${{ needs.guard.outputs.release }}
      namespace: ${{ inputs.namespace || 'muffetlab' }}
      attestations: ${{ inputs.attestations }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  # The Docker Hub mirror's Overview, once per release run. It is one document for the
  # whole <user>/php repository rather than one per series, so it cannot live in the
  # matrix: a version=all run has eight legs, and eight identical PATCH calls would
  # report one release as eight -- and if leg three failed while leg seven succeeded,
  # the document would be written by whichever finished last. One job, after the
  # matrix, is the honest version of "the Overview matches this release".
  #
  # A README-only change still goes through tools/sync-dockerhub-readme.yml, which
  # exists so the Overview can be re-synced without republishing an image.
  mirror-readme:
    needs: [guard, release]
    # Only after a release that actually published: a failed or skipped matrix must not
    # advertise a half-published set of images.
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Sync the Docker Hub mirror's Overview once for this release
        # continue-on-error because by now the tags and layers are published: a red
        # step at the tail of a good release invites someone to re-run the workflow,
        # and re-running it re-pushes images to fix a documentation pane. The script
        # does not soften its own outcome -- it prints a ::error:: naming the HTTP
        # code and whether the token or the repository is at fault.
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
          DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
          RELEASE: ${{ needs.guard.outputs.release }}
          REVISION: ${{ needs.guard.outputs.revision }}
        run: |
          set -eu
          # The mirror test is in the shell, not the "if:", on purpose. GitHub does not
          # give a step condition the secrets context (only env/vars/steps/matrix), so
          # an expression here could not prove the secret exists -- it would read an
          # unset env var as the empty string and skip quietly, which is the same
          # answer as "no mirror configured". Saying which of the two happened is worth
          # a line of output, and the line below is only reached with both set.
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "No Docker Hub mirror secrets on this repository, so there is no <user>/php repository to write an Overview for, and nothing here was skipped by accident. ${RELEASE} published to GHCR only, as revision r${REVISION}."
            exit 0
          fi
          echo "One Overview call for the whole release run (${RELEASE}, image revision r${REVISION}); this is that call."
          ./tools/sync-dockerhub-readme.sh

  # GHCR packages are created private on first push. GITHUB_TOKEN cannot
  # change package visibility, so this step uses an optional GHCR_PAT secret
  # (classic PAT with write:packages). Without the secret it skips and prints
  # the manual path: repository Packages page -> Package settings ->
  # Change visibility -> Public.
  #
  # Because that skip passes the job, a green package-visibility result says
  # nothing about whether anyone can pull what the release just wrote -- so a
  # second step asks the registry with no credentials at all and reports what an
  # anonymous reader actually sees. It is reporting, not a gate: the tags and
  # layers are already published by the time this runs, and an unreadable
  # package is fixed in package settings, not by failing a release.
  package-visibility:
    # The matrix job, not one series: a run publishes the series it selects, and a
    # skipped dependency skips its dependents -- so depending on a single series'
    # job would have hidden this check from every release that did not include it.
    # One matrix job now covers both run types, and its result is the release's
    # result: success means every selected series published on every leg, so an
    # empty or failed release never reaches here to report on nothing.
    needs: [release]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate namespace input
        env:
          NAMESPACE: ${{ inputs.namespace || 'muffetlab' }}
        run: |
          # One path segment: the published ref is <registry>/<namespace>/php,
          # so a slash or a dot-only value would silently produce a bad name.
          if ! printf '%s' "$NAMESPACE" | grep -Eq '^[a-zA-Z0-9._-]+$'; then
            echo "::error::invalid namespace '$NAMESPACE' (expected a GHCR owner, e.g. muffetlab)"
            exit 1
          fi

      # The packages API resource name is not the registry path after ghcr.io/:
      # the package page for the leaf form answers 200 and the one for the slash
      # form answers 404,
      #   https://github.com/users/muffetlab/packages/container/package/php        -> 200
      #   https://github.com/users/muffetlab/packages/container/package/muffetlab%2Fphp -> 404
      # so for this repository the API package name is `php`, and
      # `ghcr.io/muffetlab/php` is not the same string as the API resource name.
      # (The REST equivalent cannot serve as the witness: the packages API answers
      # 401 to every unauthenticated call, right or wrong name alike -- one reason
      # the step must not treat a status code as an explanation.)
      #
      # 404 from the packages API is deliberately ambiguous: wrong name, token that
      # cannot see the package, token belonging to a different account, or a package
      # under the other kind of owner all look identical. A guess-and-PATCH step
      # cannot tell those apart, so this step asks the API what the owner has before
      # it tries to change anything, confirms each candidate by reading it back, and
      # takes the visibility it reports. If that read already says public there is
      # nothing to PATCH and the correct outcome is "already public", not an error.
      # Both name forms stay in the candidate list because a fork publishing a
      # repository-scoped name really does need the slash form.
      #
      # Failure here is reported, never fatal. The tags and layers are published
      # before this runs; a red job at the tail of a good release invites someone to
      # re-run or re-tag it, which republishes image tags to fix a metadata toggle.
      # The next step reads the registry back with no credentials, so the log ends
      # with what a consumer can actually do rather than with this API's opinion.
      - name: Make GHCR package public (requires GHCR_PAT secret)
        env:
          PAT: ${{ secrets.GHCR_PAT }}
          NAMESPACE: ${{ inputs.namespace || 'muffetlab' }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          api="https://api.github.com"
          manual="GitHub repo -> Packages -> php -> Package settings -> Change visibility -> Public"
          if [ -z "$PAT" ]; then
            echo "::notice::GHCR_PAT secret not set - skipping visibility change."
            echo "::notice::Manual: ${manual}"
            exit 0
          fi
          # A package name can contain a slash; a URL path segment cannot. The API
          # wants it percent-encoded.
          enc() { printf '%s' "$1" | sed 's|/|%2F|g'; }
          # gh <method> <path> <outfile> [json-body] -> prints the HTTP code only.
          # A transport failure prints 000 rather than aborting the step, because
          # the answer to "did we reach the API" belongs in the report, not in the
          # job's exit status.
          gh() {
            if [ "$#" -ge 4 ]; then
              curl -sS --max-time 30 -o "$3" -w '%{http_code}' -X "$1" \
                -H "Authorization: Bearer $PAT" \
                -H "Accept: application/vnd.github+json" \
                -d "$4" "${api}$2" || echo 000
            else
              curl -sS --max-time 30 -o "$3" -w '%{http_code}' -X "$1" \
                -H "Authorization: Bearer $PAT" \
                -H "Accept: application/vnd.github+json" \
                "${api}$2" || echo 000
            fi
          }
          # The one field extraction needed: "key":"value". cut -f4 because the
          # matches are always "key":"value" quoted with ". No jq in this repo.
          jstr() { grep -o "\"$1\":\"[^\"]*\"" "$2" 2>/dev/null | head -1 | cut -d'"' -f4 || true; }

          # Who is this token? A 404 below is meaningless without knowing whether
          # the caller is even the package owner -- and fine-grained PATs send no
          # X-OAuth-Scopes header at all, which is itself worth printing.
          hdrs="$(mktemp)"; who="$(mktemp)"
          curl -sS --max-time 30 -D "$hdrs" -o "$who" -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" "$api/user" >/dev/null || true
          login="$(jstr login "$who")"
          scopes="$(grep -i '^x-oauth-scopes:' "$hdrs" | tr -d '\r\n' | sed 's/^[^:]*: *//' || true)"
          echo "GHCR_PAT authenticates as: ${login:-<no /user identity returned>}"
          echo "X-OAuth-Scopes: ${scopes:-<header absent -- fine-grained PATs omit it; a classic PAT needs write:packages>}"
          if [ -n "$login" ] && [ "$login" != "$OWNER" ]; then
            echo "::warning::the token's account '$login' is not the repository owner '$OWNER'. /users/<owner> package endpoints only accept the owner's own token, so a cross-account PAT 404s however correct the package name is."
          fi

          # Candidate names, most likely first: the leaf, then the full registry
          # path. Both shapes exist in the wild -- user/org-scoped containers are
          # named by their last segment, repository-scoped ones by <owner>/<name> --
          # and the slash form is the one that measured 404 here, so it is tried
          # second and never assumed.
          candidates="php ${NAMESPACE}/php"

          # What does this token think the owner has? Printed for the log, and the
          # only honest answer to "is it the name or the token that is wrong".
          for scope in "users/${OWNER}" "orgs/${OWNER}"; do
            code="$(gh GET "/${scope}/packages?package_type=container&per_page=100" /tmp/ghcr-pk-list.json)"
            if [ "$code" = "200" ]; then
              echo "  ${scope} container packages: $(grep -o '"name":"[^"]*"' /tmp/ghcr-pk-list.json | sed 's/^"name":"//; s/"$//' | sort -u | tr '\n' ' ')"
            else
              echo "  ${scope}/packages -> HTTP ${code}"
            fi
          done

          tried=""
          for scope in "users/${OWNER}" "orgs/${OWNER}"; do
            for name in $candidates; do
              path="/${scope}/packages/container/$(enc "$name")"
              code="$(gh GET "$path" /tmp/ghcr-pk.json)"
              tried="${tried}\n  GET ${path} -> ${code}"
              [ "$code" = "200" ] || continue
              vis="$(jstr visibility /tmp/ghcr-pk.json)"
              echo "Resolved package resource: ${scope} / ${name} (visibility: ${vis:-unknown})"
              if [ "$vis" = "public" ]; then
                echo "GHCR package ${name} is already public; no visibility change sent."
                exit 0
              fi
              code="$(gh PATCH "${path}/visibility" /tmp/ghcr-pk.json '{"visibility":"public"}')"
              tried="${tried}\n  PATCH ${path}/visibility -> ${code}"
              case "$code" in
                200|204)
                  echo "GHCR package ${name} is public (HTTP ${code})"
                  exit 0 ;;
                *)
                  echo "::warning::visibility change refused for ${name} under ${scope} (HTTP ${code}): $(tr -d '\n' < /tmp/ghcr-pk.json)" ;;
              esac
            done
          done
          printf "%b" "Tried:${tried}\n"
          echo "::warning::no GHCR package this token could reach matches the published image (${NAMESPACE}/php), so this step changed nothing. The anonymous registry read-back in the next step says whether that matters to a reader. Manual: ${manual}"

      # Reported, never assumed. The visibility step above exits 0 whether it
      # flipped the package, skipped because GHCR_PAT is absent, or was told the
      # name lives under another owner -- so "the job is green" has never been
      # evidence that a reader can pull the release. This asks the registry the
      # same question a stranger asks it: an unauthenticated token for
      # scope=repository:<namespace>/php:pull, then GET /v2/<namespace>/php/tags/list.
      # A public package answers 200 with its tags; a repository no one can read
      # answers with no token at all and HTTP 403 -- so the two outcomes are
      # distinguishable without any secret here. No jq and no python, because the workflows in this
      # repo are bash+awk only, and the only thing parsed is the token field.
      - name: Confirm an anonymous reader can pull the published address
        if: ${{ !cancelled() }}
        env:
          NAMESPACE: ${{ inputs.namespace || 'muffetlab' }}
        run: |
          set -eu
          repo="${NAMESPACE}/php"
          manual="GitHub repo -> Packages -> php -> Package settings -> Change visibility -> Public (or set the GHCR_PAT secret and the step above does it)"
          tok="$(curl -sS --max-time 30 \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" \
            | grep -o '"token":"[^"]*"' | sed 's/^"token":"//; s/"$//' || true)"
          if [ -z "$tok" ]; then
            echo "::warning::ghcr.io issued no anonymous pull token for ${repo}, so nothing here proves a stranger can pull it. ${manual}"
            exit 0
          fi
          body="$(mktemp)"
          # A transport failure still leaves -w printing 000, so the fallback is
          # an empty-string default rather than a second || echo (which turned the
          # message into "HTTP 000000" when stubbed).
          code="$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $tok" "https://ghcr.io/v2/${repo}/tags/list" || true)"
          code="${code:-000}"
          if [ "$code" = "200" ]; then
            echo "Anonymous read of ${repo}: HTTP ${code}; tags a stranger can list: $(tr -d ' \n' < "$body")"
          else
            echo "::warning::${repo} is not readable anonymously (HTTP ${code}); the release's tags exist but docker pull without credentials fails. ${manual}"
          fi
