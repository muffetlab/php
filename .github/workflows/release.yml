name: release

# Publishes reviewed images to the registry (GHCR by default, optional Docker
# Hub mirror when DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets exist).
#
# Published image: ghcr.io/muffetlab/php (registry + namespace inputs, image
# name "php"). The namespace is the GHCR owner, so a fork overrides it with its
# own GitHub user/org.
#
# Three entries, one pipeline: every release -- whatever started it -- goes through
# the same guard, the same validate gate, the same version resolution
# (tools/release-plan.sh) and the same dynamic matrix, so no published name is ever
# composed from two different readings of the same fact:
#   A. push a conforming vMAJOR.MINOR.PATCH tag -> every supported series, the
#      formal release. The tag is both the source marker and the scope: all of them.
#   B. dispatch with version=<series> (e.g. 8.1) -> that one series: a fix, a
#      rebuild, a targeted release.
#   C. dispatch with version=<series>,<series>,... or version=all -> several or
#      every series in one run: a batch update, one validate, one matrix, one
#      SUPPORTED.md read, one Overview sync.
# An entry that names no series is refused rather than read as "all": a blank
# dispatch must not publish eight images by accident, and neither must it finish
# green having published none.
#
# Five roles, kept deliberately apart -- this is the whole release model, and it
# is what lets a new PHP series join without touching the pipeline:
#   - A git tag marks a SOURCE RELEASE: vMAJOR.MINOR.PATCH (v1.0.0). It names no
#     PHP version, carries no build number, and contributes nothing to an image
#     name. Its one job is to answer "which commit of this repository is official
#     source". Pushing one additionally starts entry A, which is the one release
#     action a human can take with no form open -- and a tag whose name is not
#     exactly that shape is refused by the guard before any build job exists.
#   - The scope says which PHP series this run publishes: every supported series
#     for entry A, the series (or list, or all) typed into the dispatch form for
#     B and C. There is one release workflow for all three; adding PHP 8.2, 8.3 or
#     a dozen legacy lines adds a manifest, not a workflow.
#   - manifests/<series>.env holds the PHP VERSION itself (SOURCE_REF, e.g.
#     8.1.34) together with the base-image and php-src pins. The published exact
#     name is composed from the version the image was actually built at, never
#     from a tag name.
#   - The registry holds the image REVISION. tools/release-plan.sh reads the exact
#     names already published for each PHP point version and proposes one higher,
#     per point version -- r2 on 8.1.34 says nothing about 7.4.33. A dispatch no
#     longer types a build number in, so two runs cannot both claim to be the first
#     build of the same version, and a full release whose inputs have not moved
#     skips the series that is already current instead of churning a new snapshot.
#     The verdict has three answers, not two, because a release can fail after
#     publishing only part of a revision: SKIP (every declared variant is served at
#     the newest revision with the manifest's four pins), COMPLETE (some declared
#     variant is not served there and none that is has a moved pin, so the series is
#     finished at the revision it was started at instead of being incremented),
#     PUBLISH (a served pin moved, or its build record cannot be read at all -- the
#     whole series goes one revision higher). The verdict travels to the build job
#     as `mode`; MAINTAINING.md ("Publishing images") has the three of them.
#   - Docker tags express the RESULT: php:<minor>-<variant> (8.1-fpm) floats to
#     the newest build of that series, and php:<full>-r<revision>-<variant>
#     (8.1.34-r1-fpm) is a snapshot of one build, immutable by pipeline rule.
#
# Concurrency: one group for every publishing run, main or tag, because both can
# move the same <minor>-<variant> name and because the revision is read from the
# registry rather than typed in. Two releases queue instead of racing; a queued
# release is a better failure than one cancelled mid-publish.
#
# What a run publishes: for each series it selected and did not skip, the exact
# <full>-r<revision>-<variant> name composed from the PHP version the image
# reports, plus the floating <minor>-<variant> name. An OS security update that
# does not move the PHP pin bumps the revision (r1 -> r2) and publishes beside
# the old snapshot rather than over it -- which is what the registry read is
# for. The verdict travels with the leg as `mode`, and it decides what finding
# that exact name already served means: on a publish leg it is the registry
# having moved under the run, so the write is refused rather than one revision
# number coming to mean two pinsets; on a complete leg it is this release being
# already half-published, so that snapshot is left exactly as it is and only the
# missing half -- and any registry the earlier run did not reach -- is written.
# No run writes a latest tag -- see below.
#
# Safety model:
#   - No :latest-<variant>, and no plain :latest either. A run publishes the series
#     it selects, so "latest" would resolve to whichever series was released last
#     -- not the newest PHP, not a recommendation, and it could move 8.1 -> 7.4 on
#     an unrelated rebuild. <minor>-<variant> is the only floating name, and it
#     cannot change the major version.
#   - Re-runs the same static validate gate as CI (manifest policy + patch
#     SHA-256 vs review records).
#   - Every selected version's manifest must itself be release-ready: validate
#     refuses a run whose selected series is unfilled or not PATCHSET_APPROVED=1,
#     and refuses a run that selected nothing, rather than finishing green with
#     nothing published. build-version.yml still skips any manifest that is
#     unfilled or unapproved, so a release only publishes what humans have
#     reviewed; it never lowers a gate.
#   - build-version.yml builds and tests each variant natively on linux/amd64
#     and linux/arm64, pushes the per-arch images by digest, and merges them into
#     one multi-arch manifest list per tag, so every published name resolves on
#     both architectures.
#   - build-version.yml independently refuses push unless github.ref is a ref it
#     accepts -- the branch a dispatch ran on (main or master) or a tag whose name
#     is exactly vMAJOR.MINOR.PATCH -- *and* source_release names that tagged
#     source release, and only release.yml passes push=true -- so
#     the requirement that published images come from tagged source is enforced
#     both where the scope is chosen and where the registry is written.
#   - A run publishes the series it selects and did not skip: one series for a
#     version=8.1 dispatch, the listed series for version=8.1,7.4, every supported
#     series for version=all or for a tag push -- in one run, as one dynamic matrix
#     of build jobs. A selected series whose current inputs are already what the
#     registry serves is reported as skipped and left out of the matrix; the
#     difference is the four pins the published image labels into its own config,
#     so the answer comes from the image rather than from a note in this repo. The
#     series a run does not select stay on their previous build,
#     including their previous base digest, until a later run selects them. Doing
#     a full release in one run is also what keeps the SUPPORTED.md gate out of the
#     release path: the page records no registry state, so the generator reads the
#     tree and nothing else, and a run that only publishes images cannot make a
#     committed document stale.
#   - One Docker Hub Overview sync per run, from the mirror-readme job, because the
#     Overview is one piece of metadata for the whole <user>/php repository: eight
#     matrix legs would otherwise PATCH the same document eight times and report one
#     release as eight.

on:
  # Entry A: a conforming source release tag publishes every supported series.
  # GitHub's tag filter is a glob and not a regex, so `v*.*.*` also matches
  # v1.0.0-rc1 -- the guard job's first step is what decides, before any build
  # job exists, and a name that is not exactly vMAJOR.MINOR.PATCH ends the run
  # there having published nothing. A tag that does not look like a version at
  # all (a docs tag, or the legacy v7.4.33-legacy shape) starts no run whatever
  # it is named, which is what the filter is for.
  push:
    tags:
      - 'v*.*.*'
  # Entries B and C: a dispatch, from the default branch only (the guard below
  # enforces the branch, because workflow_dispatch has no branch filter).
  workflow_dispatch:
    inputs:
      version:
        # One PHP series (8.1), several (8.1,7.4), or the literal all (every
        # supported series in this one run). A free string rather than a
        # `choice` menu on purpose: a menu would repeat SUPPORTED_VERSIONS here
        # and drift from it, and adding PHP 8.2 should cost a manifest, not an
        # edit to the release pipeline.
        description: "PHP series to release (e.g. 8.1), several as a list (8.1,7.4), or all for every supported series"
        type: string
        required: true
        default: "8.1"
      namespace:
        description: "GHCR owner/namespace that hosts the php image (default: muffetlab)"
        type: string
        default: "muffetlab"
      attestations:
        # The image revision is not an input any more: it is read out of the
        # registry per PHP point version by tools/release-plan.sh, so there is
        # nothing to type and nothing for two runs to disagree about. A
        # tag-triggered run has no form, so it gets the default below.
        description: "Attach provenance/SBOM attestations"
        type: boolean
        default: true

concurrency:
  # One group for every publishing run, whatever started it or which series it
  # names. Two reasons, and both come from what entry A made true: a tag run and
  # a dispatch can move the same <minor>-<variant> name, and the image revision
  # is now read out of the registry rather than typed in -- two runs in flight
  # would both conclude "I am r2" and the second would be refused at the write,
  # after thirty minutes of building. Queuing is cheaper than that, and it is
  # the whole reason the derived revision can be trusted: release-plan.sh's read
  # and build-version.yml's write happen with no other publishing run between
  # them. Per-series groups would be faster and wrong: ",8.1," and "all"
  # overlap. cancel-in-progress stays false: a release cancelled mid-publish
  # leaves some tags written and some not, and a queued release is the better
  # failure.
  group: release
  cancel-in-progress: false

env:
  SUPPORTED_VERSIONS: "5.6 7.0 7.1 7.2 7.3 7.4 8.0 8.1"

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # The source release being published -- the git tag whose commit this run
      # builds from (vMAJOR.MINOR.PATCH). A git tag marks source; it names no
      # PHP version, carries no image revision, and appears nowhere in a
      # published name. It is here because publishing from untagged source is
      # refused, so every image in the registry answers "which reviewed commit
      # is this".
      release: ${{ steps.srctag.outputs.release }}
      # The PHP series this run publishes, as the comma-padded list the
      # readiness step and the release matrix are built from: ",8.1," for
      # version=8.1, ",8.1,7.4," for a list, and ",5.6,7.0,...,8.1," for all --
      # which is also what a tag push always selects. Padded on both sides so
      # one series can never match inside another the way a bare substring
      # search would -- ",8.1," is not inside ",8.10,". Empty selects nothing,
      # and the readiness step below treats that as a failure instead of letting
      # the run go green with an empty matrix.
      selected: ${{ steps.scope.outputs.selected }}
      # Which of the three entries started this run: A is the tag push, B a
      # dispatch that named one series, C a dispatch that named several or all.
      # Counted here rather than trusted from the form, because what the run is
      # about to publish depends on it.
      entry: ${{ steps.scope.outputs.entry }}
    steps:
      - name: Release allowed only from a conforming tag or the default branch
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -eu
          case "$EVENT" in
            push)
              # Entry A. GitHub filtered the tag to v*.*.* first, and that is a
              # glob, so v1.0.0-rc1 reaches this step too. The shape is decided
              # here, before a checkout, a build, or a credential: a tag that is
              # not exactly vMAJOR.MINOR.PATCH publishes nothing.
              tag="${REF#refs/tags/}"
              if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error::pushed tag '$tag' is not a source release tag (expected exactly vMAJOR.MINOR.PATCH, e.g. v1.0.0), so nothing was published from it. A pre-release or a trial tag should be named outside the v*.*.* filter -- e.g. rc-1.0.0 -- so this workflow is not started at all"
                exit 1
              fi
              ;;
            workflow_dispatch)
              # Not just a branch rule any more: with two entries, a run that
              # was neither dispatched from the default branch nor pushed as a
              # release tag has no business holding registry credentials
              # whatever its ref looks like.
              if [ "$REF" != refs/heads/main ] && [ "$REF" != refs/heads/master ]; then
                echo "::error::a dispatch publishes only from main or master (this run is on $REF); pushing a tag is the other entry, and there is no third"
                exit 1
              fi
              ;;
            *)
              echo "::error::release runs only from a source release tag push or a workflow_dispatch on the default branch (this event is '$EVENT'); a pull request or a branch push cannot reach a registry"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7
        with:
          # Every tag and every commit, because the step below asks whether
          # *this commit* carries a source release tag. A shallow branch
          # checkout has the commit but not the tag refs that point at it, and
          # that would make a correctly tagged release look untagged.
          fetch-depth: 0

      - name: Source release tag check
        id: srctag
        env:
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -eu
          # A git tag marks a source release. It does not name a PHP version,
          # does not carry the image revision, and contributes nothing to an
          # image name -- which is exactly why one tag can cover a release of
          # eight series: the scope came from the entry (every series for a tag,
          # the form for a dispatch), and the tag is left alone to do the one
          # thing it is good at, recording which commit of this repository is
          # official source. Tags are still never moved, so the namespace stays
          # an append-only history of source releases. What it no longer claims
          # to be is a history of builds: that is the registry's -r<N>
          # namespace, and this repository reads it rather than copying it.
          case "$EVENT" in
            push)
              # The ref this run is on *is* the source release, and the entry
              # step above already refused a name that is not one.
              release="${REF#refs/tags/}"
              ;;
            workflow_dispatch)
              # grep with no match would end the step on its exit status, so ||
              # true keeps the empty answer on the path that prints the real
              # message.
              tags="$(git tag --points-at "$SHA" | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V)"
              if [ -z "$tags" ]; then
                echo "::error::commit $(printf '%.10s' "$SHA") carries no source release tag (expected vMAJOR.MINOR.PATCH, e.g. git tag v1.0.0 && git push origin v1.0.0); refusing to publish an image whose source is not a tagged release"
                exit 1
              fi
              count="$(printf '%s\n' "$tags" | wc -l | tr -d ' ')"
              # Two release tags on one commit is legal but ambiguous. Publish
              # under the highest rather than whichever git happens to list
              # first, and say so -- the commit is the same either way, so this
              # changes only the label.
              release="$(printf '%s\n' "$tags" | tail -1)"
              if [ "$count" != 1 ]; then
                echo "Notice: ${count} source release tags point at this commit ($(printf '%s\n' "$tags" | tr '\n' ' ')); publishing under ${release}"
              fi
              ;;
          esac
          # Both entries end with the same proof, asked of git rather than of
          # the event: "published from ${release}" is a claim about this commit,
          # and it is cheap to verify here rather than to have a consumer
          # disprove from the image's dev.php-legacy.source-release label.
          if ! git tag --points-at "$SHA" | grep -Fxq -- "$release"; then
            echo "::error::source release tag ${release} does not point at commit $(printf '%.10s' "$SHA"); refusing to publish an image labelled with a release it was not built from"
            exit 1
          fi
          echo "Publishing source release ${release} at commit $(printf '%.10s' "$SHA"), on $(git log -1 --format=%s)"
          echo "release=${release}" >> "$GITHUB_OUTPUT"

      # A free string rather than a `choice` input: a choice list would repeat
      # the supported series here and drift from SUPPORTED_VERSIONS (the same
      # list build.sh and manifests/*.env agree with). A typo costs a
      # five-second guard failure, which is the point of checking it before
      # validate.
      - name: Release scope check
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -eu
          # "all" is a formally supported value, not a convenience: it selects
          # every supported series in this one run, so a full release is one
          # validate, one matrix, one Overview sync. It is also the reason this
          # workflow needs no per-version release file: a new PHP series joins
          # by adding a manifest and a SUPPORTED_VERSIONS row, and `all` starts
          # publishing it with no pipeline edit. A tag push takes that path
          # without anyone typing it.
          if [ "$EVENT" = push ]; then
            # The first step refused a push standing on anything but a
            # conforming tag, and this says the same thing from the ref rather
            # than from the event name: the two steps must not be one edit away
            # from disagreeing about what an untyped "all" covers.
            case "$REF" in
              refs/tags/*) ;;
              *) echo "::error::only a tag push selects every series without a form ($REF is not a tag ref); the pushed tag's shape is the first step's check, this one is that it is a tag at all"; exit 1 ;;
            esac
            raw=all
          else
            raw="$VERSION_INPUT"
          fi
          raw="$(printf '%s' "$raw" | tr -d '[:space:]')"
          # An empty scope is refused, never interpreted. Reading "" as "all"
          # publishes eight series from a form that asked for none; reading it
          # as "none" finishes a release run green with nothing published. Both
          # are worse than a five-second failure that says what to type.
          if [ -z "$raw" ]; then
            echo "::error::no PHP series was selected: a dispatch with an empty version field is refused rather than read as 'all'. Type one series (8.1), a list (8.1,7.4), or all -- or push a vMAJOR.MINOR.PATCH tag, which selects every supported series"
            exit 1
          fi
          if [ "$raw" = all ]; then
            # Comma-padded list of every supported series; the plan job turns it
            # into the matrix this run builds.
            selected=",$(printf '%s' "$SUPPORTED_VERSIONS" | tr ' ' ','),"
          else
            # One series or several, and the same two checks for each: shaped
            # like a PHP series, and actually supported. A list is expanded here
            # so nothing downstream ever has to parse a comma again.
            listed=""
            # shellcheck disable=SC2086  # splitting the caller's list into words is the point
            for item in $(printf '%s' "$raw" | tr ',' ' '); do
              if ! printf '%s' "$item" | grep -Eq '^[0-9]+\.[0-9]+$'; then
                echo "::error::version '$item' is not a PHP series (expected <major>.<minor>, e.g. 5.6; a comma-separated list of them; or all for every supported series)"
                exit 1
              fi
              case " $SUPPORTED_VERSIONS " in
                *" $item "*) ;;
                *)
                  echo "::error::version '$item' names PHP series '$item', which is not supported (supported: $SUPPORTED_VERSIONS)"
                  exit 1 ;;
              esac
              case ",$listed," in
                *",$item,"*) echo "::warning::version '$raw' lists ${item} twice; publishing it once" ;;
                # Joined without a leading separator, so the padded list this
                # step outputs is the one its own comment documents: ",8.1," for
                # version=8.1, not ",,8.1,".
                *) if [ -z "$listed" ]; then listed="$item"; else listed="${listed},${item}"; fi ;;
              esac
            done
            selected=",$listed,"
          fi
          set -f
          # shellcheck disable=SC2086  # splitting the padded list is the point
          set -- $(printf '%s' "$selected" | tr ',' ' ')
          set +f
          [ "$#" -gt 0 ] || {
            echo "::error::version '$raw' selected no PHP series"; exit 1; }
          # A, B, C are named by what the run was asked to publish, not by how
          # it was typed: the tag is A, one series from the form is B, and more
          # than one -- listed or all -- is C.
          if [ "$EVENT" = push ]; then
            entry=A
          elif [ "$#" -gt 1 ] || [ "$raw" = all ]; then
            entry=C
          else
            entry=B
          fi
          echo "Release entry ${entry}: $# PHP series ($*), image revisions from the registry"
          echo "selected=${selected}" >> "$GITHUB_OUTPUT"
          echo "entry=${entry}" >> "$GITHUB_OUTPUT"

  validate:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Shellcheck scripts
        run: |
          # Glob, do not enumerate: a new script must be linted without anyone
          # remembering to add it to a list in three workflows.
          mapfile -t files < <(find . -name '*.sh' -not -path './.git/*' | sort)
          printf 'shellcheck: %s\n' "${files[@]}"
          shellcheck -x "${files[@]}"

      - name: Bash syntax check
        run: |
          mapfile -t files < <(find . -name '*.sh' -not -path './.git/*' | sort)
          bash -n "${files[@]}"

      - name: Dockerfile RUN shell syntax
        run: ./tools/lint-dockerfile-shells.sh

      - name: Verify-script harness
        run: |
          ./tests/verify-harness.sh

      # Same reason as in build-and-verify.yml, and more important here: this is
      # the gate in front of a push. A run whose OS gate never scanned must not
      # be able to reach the registry looking like a clean one.
      - name: OS gate verdict harness
        run: |
          ./tests/scan-image-harness.sh

      # Same reason as in build-and-verify.yml, and the same warning: this is
      # the gate in front of a push, so the step that decides which exact tag
      # each series gets is checked here against a fake registry read rather
      # than discovered by a release that overwrote -- or skipped -- a real
      # name.
      - name: Release-plan harness
        run: |
          ./tests/release-plan-harness.sh

      - name: Version-branch inventory in sync
        run: |
          ./tools/list-version-branches.sh
          ./tools/list-version-branches.sh --check

      # Same gate as build-and-verify.yml: this is the workflow that publishes,
      # so the extension baseline copies are re-checked here rather than relying
      # on the PR run having happened.
      - name: Extension baseline copies in sync
        run: ./tools/check-ext-baseline.sh --check

      # Same reasoning as build-and-verify.yml, and the same reason this
      # workflow needs it at all: the merge job publishes an Overview as part of
      # a release, and a release cannot be un-published cleanly. Checking the
      # payload builder here means the release that writes the text has already
      # run the assertions about that text, on the same runner image.
      - name: Docker Hub README sync self-test
        run: ./tools/sync-dockerhub-readme.sh --self-test

      - name: Manifest policy check
        run: |
          set -eu
          fail=0
          err() { echo "::error::$*"; fail=1; }
          for v in $SUPPORTED_VERSIONS; do
            [ -f "manifests/$v.env" ] || err "missing manifests/$v.env"
          done
          for f in manifests/*.env; do
            ver="$(basename "$f" .env)"
            case " $SUPPORTED_VERSIONS " in
              *" $ver "*) ;;
              *) err "$f: version not in supported list"; continue ;;
            esac
            # Trusted project config, not untrusted input.
            # shellcheck source=/dev/null
            . "./$f"
            case "${OPENSSL_ROUTE:-}" in openssl11|openssl3) ;; *) err "$f: bad OPENSSL_ROUTE" ;; esac
            if [ "$ver" = "5.6" ] && [ "${OPENSSL_ROUTE:-}" != "openssl11" ]; then
              err "$f: 5.6 requires openssl11"
            fi
            if [ "$ver" != "5.6" ] && [ "${OPENSSL_ROUTE:-}" != "openssl3" ]; then
              err "$f: $ver requires openssl3"
            fi
            # Source of record for every series is the backports fork: the
            # official php/php-src tree ships no security fixes for an EOL line.
            # Moving a manifest to official php-src is a reviewed change to this
            # policy, to build.sh and to the Dockerfile guard -- not a manifest
            # edit.
            case "${PHP_SRC_REPO:-}" in
              *php-src-backports*) ;;
              "") err "$f: PHP_SRC_REPO unset" ;;
              *) err "$f: PHP_SRC_REPO must be shivammathur/php-src-backports (got '${PHP_SRC_REPO:-}')" ;;
            esac
            if ! printf '%s' "${PHP_SRC_COMMIT:-}" | grep -Eq '^[0-9a-f]{40}$'; then
              err "$f: PHP_SRC_COMMIT must be a full 40-character commit SHA"
            fi
            # "@sha256:" alone is not a pin: an unfilled manifest ships
            # "@sha256:REPLACE_WITH_DIGEST". Require 64 hex, but report it as an
            # unready manifest (build jobs skip it) rather than a validate
            # failure.
            case "${BASE_IMAGE:-}" in
              *@sha256:*)
                digest="${BASE_IMAGE##*@sha256:}"
                if ! printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$'; then
                  case "$digest" in
                    REPLACE_WITH*)
                      echo "::warning::$f: BASE_IMAGE digest is still a placeholder; run tools/resolve-base-digest.sh in CI and fill it before this version builds" ;;
                    *)
                      echo "::warning::$f: BASE_IMAGE digest '${digest}' is not 64 lowercase hex -- this manifest is not buildable yet (run tools/resolve-base-digest.sh in CI)" ;;
                  esac
                fi
                ;;
              "") err "$f: BASE_IMAGE unset" ;;
              *) err "$f: BASE_IMAGE must be pinned by digest (repo@sha256:<64 hex>)" ;;
            esac
            variants="${BUILD_VARIANTS:-}"
            [ -n "$variants" ] || err "$f: BUILD_VARIANTS empty"
            for vv in $variants; do
              case "$vv" in cli|fpm) ;; *) err "$f: bad BUILD_VARIANTS entry '$vv'" ;; esac
            done
            case "${PATCHSET_APPROVED:-}" in 0|1) ;; *) err "$f: PATCHSET_APPROVED must be 0 or 1" ;; esac
            # apt lists are interpolated unquoted into apt-get inside the image
            # build, so they must be plain Debian package specifications
            # (name[:arch][=version]) -- same rule build.sh enforces.
            pkg_re='^[A-Za-z0-9][A-Za-z0-9.+-]*(:[A-Za-z0-9.+-]+)?(=[A-Za-z0-9.+:~-]+)?$'
            for plist in BUILD_PACKAGES RUNTIME_PACKAGES; do
              eval "plistval=\${$plist:-}"
              # shellcheck disable=SC2086
              for tok in $plistval; do
                printf '%s' "$tok" | grep -Eq "$pkg_re" \
                  || err "$f: $plist contains an invalid package specification '$tok'"
              done
            done
            # 1 = ship the configured source tree (official-image parity), 0 =
            # omit it to keep the image small. Only those two are valid.
            case "${SHIP_PHP_SOURCE:-1}" in 0|1) ;; *) err "$f: SHIP_PHP_SOURCE must be 0 or 1" ;; esac
            # PHP_EXTENSIONS / PECL_EXTENSIONS add to the kit baseline and are
            # interpolated unquoted into build-stage shell, so they get the same
            # kind of shape check as the apt lists (an extension name is
            # [a-z0-9_]). Which names a series can build at all is the
            # Dockerfile's availability table -- deliberately not duplicated
            # here.
            ext_re='^[a-z0-9_]+$'
            for elist in PHP_EXTENSIONS PECL_EXTENSIONS; do
              eval "elistval=\${$elist:-}"
              # shellcheck disable=SC2086
              for tok in $elistval; do
                printf '%s' "$tok" | grep -Eq "$ext_re" \
                  || err "$f: $elist contains an invalid extension name '$tok'"
              done
            done
            # Optional Composer overrides must respect the series policy.
            cv="${COMPOSER_VERSION:-}"
            cs="${COMPOSER_SHA256:-}"
            case "$ver" in 5.6|7.0|7.1) policy_cv="1.10.28" ;; *) policy_cv="2.11.0" ;; esac
            if [ -n "$cv" ]; then
              if ! printf '%s' "$cv" | grep -Eq '^(1\.10|2)(\.[0-9]+)+$'; then
                err "$f: COMPOSER_VERSION must be an exact 1.10.x or 2.x release (got '$cv')"
              fi
              case "$ver:$cv" in
                5.6:2.*|7.0:2.*|7.1:2.*)
                  err "$f: PHP $ver cannot run Composer 2.x (requires PHP >= 7.2.5)" ;;
              esac
              if [ -z "$cs" ] && [ "$cv" != "$policy_cv" ]; then
                echo "::warning::$f: COMPOSER_VERSION=$cv overrides the policy pin without COMPOSER_SHA256"
              fi
            fi
            if [ -n "$cs" ] && ! printf '%s' "$cs" | grep -Eq '^[0-9a-f]{64}$'; then
              err "$f: COMPOSER_SHA256 must be 64 lowercase hex chars"
            fi
          done
          [ "$fail" = 0 ]

      - name: Composer pins in sync
        run: |
          set -eu
          fail=0
          err() { echo "::error::$*"; fail=1; }
          legacy_pin="$(sed -n 's/.*policy_ver="\(1\.10\.[0-9]*\)".*/\1/p' Dockerfile | head -1)"
          modern_pin="$(sed -n 's/.*policy_ver="\(2\.[0-9.]*\)".*/\1/p' Dockerfile | head -1)"
          [ -n "$legacy_pin" ] || err "Dockerfile: legacy Composer pin not found"
          [ -n "$modern_pin" ] || err "Dockerfile: modern Composer pin not found"
          # Keep this list identical to the same step in build-and-verify.yml:
          # the doc that must carry both pins is DEPLOYING.md's per-series
          # table, not README.md, which points there instead of quoting the
          # numbers.
          for f in build.sh .github/workflows/build-version.yml tools/gen-supported.sh DEPLOYING.md MAINTAINING.md SUPPORTED.md; do
            grep -Fq "$legacy_pin" "$f" || err "$f: missing Composer pin $legacy_pin"
            grep -Fq "$modern_pin" "$f" || err "$f: missing Composer pin $modern_pin"
          done
          [ "$fail" = 0 ]

      - name: Published image address in sync
        run: ./tools/check-image-name.sh

      - name: Vendored docker-php-ext hash check
        run: |
          set -eu
          (cd docker-php-ext && shasum -a 256 -c SHA256SUMS)
          dockerfile_sha="$(sed -n 's/^ENV DOCKER_PHP_EXT_SRC_COMMIT=\([0-9a-f]\{40\}\)$/\1/p' Dockerfile)"
          [ -n "$dockerfile_sha" ] || { echo "::error::DOCKER_PHP_EXT_SRC_COMMIT pin not found in Dockerfile"; exit 1; }
          grep -q "$dockerfile_sha" docker-php-ext/README.md || {
            echo "::error::Dockerfile pin $dockerfile_sha not recorded in docker-php-ext/README.md"; exit 1; }

      - name: Patch review record check
        run: |
          set -eu
          fail=0
          err() { echo "::error::$*"; fail=1; }
          for dir in patches/*/; do
            [ -d "$dir" ] || continue
            ver="$(basename "$dir")"
            case " $SUPPORTED_VERSIONS " in
              *" $ver "*) ;;
              *) err "$dir: unsupported version directory"; continue ;;
            esac
            for p in "$dir"*.patch; do
              [ -e "$p" ] || continue
              rec=""
              for r in "$dir"REVIEW-*.md; do
                [ -e "$r" ] || continue
                if grep -Fqi "$(basename "$p")" "$r"; then rec="$r"; break; fi
              done
              if [ -z "$rec" ]; then
                err "$p: no review record (REVIEW-*.md referencing this file)"
                continue
              fi
              hash="$(sha256sum "$p" | awk '{print $1}')"
              if ! grep -Fq "$hash" "$rec"; then
                err "$p: SHA-256 $hash not recorded in $rec"
              fi
            done
          done
          [ "$fail" = 0 ]

      - name: SUPPORTED.md up to date
        run: |
          ./tools/gen-supported.sh
          # The generator reads the tree and nothing else, so this comparison is
          # byte-exact: no timestamp line, no registry answer, no outage to
          # excuse a difference.
          if ! git diff --quiet -- SUPPORTED.md; then
            echo "::error::SUPPORTED.md is stale; run tools/gen-supported.sh and commit"
            git diff -- SUPPORTED.md
            exit 1
          fi

      # Every series this run publishes, not "any of them": an unreviewed or
      # unfilled manifest has to fail the run instead of going green with no
      # image published. For a version=all run that reading is deliberately
      # strict -- a "full release" that published six series and skipped two is
      # worse than one that never started, and the skipped series would still
      # have had its floating tag repointed by nothing. The same fields
      # build-version.yml checks before it will start a build.
      - name: Selected series are release-ready
        env:
          SELECTED: ${{ needs.guard.outputs.selected }}
        run: |
          set -eu
          [ -n "$SELECTED" ] || { echo "::error::guard selected no PHP series"; exit 1; }
          # ",5.6,7.0," -> the words 5.6 and 7.0. The comma padding leaves empty
          # fields, which word splitting drops; set -f keeps a malformed value
          # from globbing against the working tree.
          set -f
          # shellcheck disable=SC2086  # splitting the padded list is the point
          set -- $(printf '%s' "$SELECTED" | tr ',' ' ')
          set +f
          # A list of nothing but separators. The guard cannot emit one today,
          # but this step is the last place that knows what the run is supposed
          # to publish, so it is the place to refuse: an empty loop below prints
          # "release-ready" for zero series and the run would finish green with
          # every build job skipped by its own gate.
          [ "$#" -gt 0 ] || {
            echo "::error::guard selected no PHP series to publish ('$SELECTED'); refusing to finish green with nothing published"; exit 1; }
          for SERIES in "$@"; do
            printf '%s' "$SERIES" | grep -Eq '^[0-9]+\.[0-9]+$' || {
              echo "::error::guard produced an invalid series '$SERIES'"; exit 1; }
            [ -f "manifests/$SERIES.env" ] || {
              echo "::error::manifests/$SERIES.env is missing"; exit 1; }
            # Cleared before sourcing so a manifest that omits a field cannot
            # inherit the previous series' answer and read as ready.
            unset BASE_IMAGE SOURCE_REF PHP_SRC_COMMIT PATCHSET_APPROVED
            # Trusted project config, not untrusted input.
            # shellcheck source=/dev/null
            . "manifests/$SERIES.env"
            unready=""
            for var in BASE_IMAGE SOURCE_REF PHP_SRC_COMMIT; do
              eval "val=\${$var:-}"
              case "$val" in ""|*REPLACE_WITH*) unready="${unready} ${var}" ;; esac
            done
            # "@sha256:" alone is not a pin: the placeholder text has to be 64 hex.
            case "${BASE_IMAGE:-}" in
              *@sha256:*)
                printf '%s' "${BASE_IMAGE##*@sha256:}" | grep -Eq '^[0-9a-f]{64}$' \
                  || unready="${unready} BASE_IMAGE-digest" ;;
              *) unready="${unready} BASE_IMAGE-pin" ;;
            esac
            [ "${PATCHSET_APPROVED:-0}" = "1" ] || unready="${unready} PATCHSET_APPROVED"
            if [ -n "$unready" ]; then
              echo "::error::PHP series $SERIES is not release-ready (unset or placeholder:${unready}); refusing to run an incomplete release"
              exit 1
            fi
            echo "PHP series $SERIES is release-ready; publishing its declared variants ($(sed -n 's/^BUILD_VARIANTS="\(.*\)"/\1/p' "manifests/$SERIES.env"))"
          done
          echo "Selected series are release-ready: $*"

  # --- Three entries, one version resolution, one dynamic matrix
  # ---------------- Whatever started the run -- a tag, one series, a list, or
  # all of them -- the scope becomes a matrix here instead of eight hand-written
  # jobs, and the matrix comes from one resolver rather than from this file.
  # That is the payoff of keeping the git tag, the PHP version and the image
  # revision apart: adding PHP 8.2, 8.3 or another legacy line costs a manifest
  # and a SUPPORTED_VERSIONS row, and a tag push or version=all starts
  # publishing it with nothing in this file edited. Eight static
  # release-<series> jobs could not say that; each new series would need a new
  # job, a new gate token, and a new assertion in tools/check-image-name.sh to
  # keep the pair honest.
  #
  # tools/release-plan.sh answers three questions per selected series, in one read
  # of the registry, and nothing else in the pipeline is allowed to answer them:
  #   - which PHP version (manifests/<series>.env SOURCE_REF),
  #   - which image revision (one above the highest -r<N> GHCR already serves for
  #     that point version, counted across the variants the series declares), and
  #   - whether there is anything to publish at all (a series whose published build
  #     record already matches the manifest's four pins is reported as skipped and
  #     left out of the matrix rather than rebuilt into a new snapshot nobody asked
  #     for).
  # A matrix of zero entries is a legitimate outcome -- "the tag you pushed changes
  # nothing" -- and the run says so in its log instead of failing or pretending.
  #
  # plan emits that JSON; release calls the reusable build workflow once per
  # entry. fail-fast is off on purpose -- one series' build failure must not
  # cancel the healthy siblings that already have fixes to publish. Within one
  # leg, build-version.yml covers the variants the plan named on amd64 and arm64
  # -- both declared variants for a `publish`, and for a `complete` only the ones
  # the registry does not serve at that revision -- so "one series" is never
  # "one image".
  #
  # No caller here passes base_image_override: a release builds on the
  # manifest's reviewed BASE_IMAGE and nothing else, and build-version.yml fails
  # the run if push=true ever arrives together with an override, so a trial
  # cannot publish even through a future caller that forgot the rule.
  plan:
    needs: [guard, validate]
    # packages: read is what makes the registry read below authenticated: the
    # job token is handed to release-plan.sh as REGISTRY_READ_TOKEN, so a
    # package that exists but is still private -- GHCR creates every package
    # private, and the visibility job runs after the matrix -- and a repository
    # the owner deleted both get an answer instead of a refusal. The read is
    # still read-only, and a registry that refuses the token still stops the run.
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      # JSON array, one object per series this run will actually publish. `php`
      # is the manifest's SOURCE_REF -- the PHP version the *configuration* says
      # this series is, not a tag and not an input -- `variants` is what each
      # series will publish, and `revision` is the number the registry says is
      # next. All three reach the run log through the matrix, because "what did
      # this release do" should be answerable from the run that did it.
      matrix: ${{ steps.matrix.outputs.matrix }}
      # A, B or C: which entry started the run, printed in the log and in the
      # notice that a run which resolved to nothing published is honest about.
      entry: ${{ needs.guard.outputs.entry }}
      # How many legs the resolver left to publish -- zero is a real answer here.
      legs: ${{ steps.matrix.outputs.legs }}
      # The selection the resolver was asked about, in its own comma form. The
      # mirror job reads the same registry later, after the matrix has
      # published, and has to ask about the same series; recomposing that list
      # from the guard's padded output is how two jobs come to mean two
      # different things by "this run's scope".
      scope: ${{ steps.matrix.outputs.scope }}
    steps:
      - uses: actions/checkout@v7

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Resolve versions, revisions and skips into the release matrix
        id: matrix
        env:
          SELECTED: ${{ needs.guard.outputs.selected }}
          NAMESPACE: ${{ inputs.namespace || 'muffetlab' }}
          ENTRY: ${{ needs.guard.outputs.entry }}
          # Only ever sent as the password of a pull-token request to the
          # registry host the resolver defaults to; no caller here overrides
          # that host, so the token cannot be pointed elsewhere.
          REGISTRY_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # ",5.6,7.0," -> the words 5.6 and 7.0. The comma padding leaves empty
          # fields, which word splitting drops; set -f keeps a malformed value
          # from globbing against the working tree.
          set -f
          # shellcheck disable=SC2086  # splitting the padded list is the point
          set -- $(printf '%s' "$SELECTED" | tr ',' ' ')
          set +f
          # validate's readiness step already refused an empty selection, so
          # this is the second lock: a matrix built from no series would run no
          # build job at all, every later job would read it as skipped, and the
          # run would still look like a release that published nothing. A *full*
          # selection that resolves to no legs is a different thing -- see below
          # -- and is reported, not refused.
          [ "$#" -gt 0 ] || {
            echo "::error::no PHP series was selected (guard emitted '${SELECTED:-<empty>}'); refusing to build an empty release matrix"
            exit 1
          }
          # The resolver's own comma-separated form, rebuilt from the words
          # above rather than by deleting the padding from the guard's list: `tr
          # -d ','` on ",8.1,5.6," yields "8.15.6", which is no series at all --
          # so the multi-series entry would have been refused by the resolver
          # for a reason nothing in the log explains. Joining the split words
          # puts commas where the guard's padding had none, and keeps guard,
          # validate and plan speaking about the identical selection by
          # construction.
          scope="$(IFS=,; printf '%s' "$*")"
          # First pass: read the live registry, print the verdict per series for
          # the human reading the log, and capture exactly what was read.
          if ! plan_report="$(./tools/release-plan.sh --scope "$scope" \
              --namespace "$NAMESPACE" --state-out "$RUNNER_TEMP/release-state.json")"; then
            printf '%s\n' "$plan_report"
            echo "::error::the release plan could not be resolved for '${scope}'; nothing was built or published. A registry this step cannot read is not a reason to guess a revision"
            exit 1
          fi
          printf '%s\n' "$plan_report"
          # Second pass: the matrix, from the captured read rather than a fresh
          # one. The two passes cannot then disagree -- the log and the legs are
          # the same answer to the same question, asked once -- and the same
          # --state-in/--state-out pair is what tests/release-plan-harness.sh
          # asserts against fixtures, with no network.
          if ! matrix="$(./tools/release-plan.sh --scope "$scope" \
              --namespace "$NAMESPACE" --state-in "$RUNNER_TEMP/release-state.json" --json)"; then
            printf '%s\n' "$matrix"
            echo "::error::the captured release plan did not produce a matrix"
            exit 1
          fi
          printf '%s\n' "$matrix" | jq -e 'type == "array"' >/dev/null || {
            echo "::error::the release plan emitted something that is not a JSON array: $matrix"
            exit 1; }
          legs="$(printf '%s' "$matrix" | jq 'length')"
          if [ "$legs" = 0 ]; then
            # Nothing to build, and the reason is in the SKIP lines above: the
            # registry already serves exactly these pins for every selected
            # series. Publishing r2 anyway would be a snapshot of a build that
            # changed nothing, under a floating name that would move to it.
            echo "::notice::entry $ENTRY: every selected series (${scope}) is already published from these exact inputs, so this run builds and pushes nothing. The SKIP lines above name the pins that matched; a run that should publish anyway needs a manifest that moved."
          else
            printf '%s\n' "$matrix" |
              jq -r '.[] | "Release leg: PHP \(.series) -> \(.php) at r\(.revision), building \(.variants), verdict \(.mode)"'
            echo "Selected series: $# selected, ${legs} to publish ($# of $(printf '%s' "$SUPPORTED_VERSIONS" | wc -w | tr -d ' ') supported)"
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'legs=%s\n' "$legs" >> "$GITHUB_OUTPUT"
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"

  release:
    needs: [guard, validate, plan]
    # Evaluated before the matrix expands, so the plan's all-SKIP answer (an
    # empty matrix, which `include:` cannot express) skips the job instead of
    # failing the workflow on "matrix must define at least one vector". The
    # jobs behind this one key on `needs.release.result`, so a skip fans out
    # the same way a success does, just with nothing published.
    if: ${{ needs.plan.outputs.legs != '0' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-version.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version: ${{ matrix.series }}
      push: true
      # The image revision every published exact name carries
      # (<php>-r<revision>-<variant>) -- one per series, resolved from the
      # registry by the plan step and arriving through the matrix, so two series
      # on different PHP versions get the number each one's own names imply. It
      # is not an input anyone types: that is what makes a full release
      # idempotent and what keeps two runs from both claiming to be the first
      # build of a version.
      revision: ${{ matrix.revision }}
      # The plan's verdict for this series at this revision, from the same
      # registry read that picked the number. It says nothing about what to
      # build and everything about what an already-served exact name means:
      # `publish` promised a revision the registry has not served, so finding it
      # there is a conflict and the leg refuses; `complete` promised the series
      # is being finished at a revision it has partly served, so finding a
      # variant there is that release being already published and the name is
      # left alone. Defaults to the stricter of the two in the callee, so a leg
      # that arrives without one cannot turn a collision into a silent skip.
      mode: ${{ matrix.mode }}
      # The variants this leg is to build, from the same registry read that picked
      # the number: every declared variant for a `publish`, only the missing ones
      # for a `complete`. The callee gates both its jobs on this list, so a
      # completion never recompiles -- and never pushes digests it would then
      # refuse to name -- for a variant the registry already serves at r<N>.
      variants: ${{ matrix.variants }}
      # The git tag of the source being published. The guard above required the
      # pushed tag -- or the dispatched commit's tag -- to be exactly that
      # shape, and build-version.yml refuses push=true without it, so publishing
      # from untagged source is blocked at both ends of the call.
      source_release: ${{ needs.guard.outputs.release }}
      namespace: ${{ inputs.namespace || 'muffetlab' }}
      # A dispatch's checkbox, or true when there was no form at all: entry A
      # has nothing to ask, and a release that silently lost its attestations
      # because an unset input read as false would be a worse surprise than a
      # run that said which one it was.
      attestations: ${{ inputs.attestations != false }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  # The Docker Hub mirror, brought up to GHCR by copying. A mirror is not a
  # second build: when GHCR already serves a name, the image the mirror is
  # allowed to hold under it is GHCR's, because a PHP compile is not
  # reproducible and this run's digests differ from a published one even when
  # its pins match. So this job asks the resolver -- which reads GHCR and only
  # GHCR -- for the names it verified as current, and copies exactly those, then
  # points the mirror's floating names at them. What it never does is build,
  # delete, or write an exact name the mirror already serves. The distinction
  # that matters on the mirror is the one between a missing tag and an existing
  # one: a missing tag is filled by copying, an existing tag is never widened or
  # rewritten -- an incomplete copy and a snapshot of a different build are both
  # refused, and the refusal names which of the two it found, because deleting
  # the tag is a human's act on a service this pipeline is not granted, and
  # after the deletion the same job re-syncs the name from GHCR whole. That
  # repair moves no revision: the mirror is a repairable copy of the registry
  # that records what was published, and a mirror that is missing, unreachable
  # or wrong never moves a GHCR revision.
  #
  # It reads the registry afresh rather than reusing the plan job's capture, and
  # that is the point: the matrix has published since that capture, so a repair
  # planned from the capture would copy the state the release departed from. The
  # scope is the plan's own, handed over as an output, so the two reads ask
  # about the identical selection.
  #
  # This is what makes "GHCR succeeded, Docker Hub failed" a revision-neutral
  # repair: the next run's plan finds the series current on GHCR, emits no leg
  # at all, and the names still owed to the mirror are named here instead. That
  # is also why the job runs whatever the matrix did -- a leg that failed on the
  # mirror alone has left GHCR correct, which is precisely the case worth
  # finishing.
  mirror-repair:
    needs: [guard, validate, plan]
    # Deliberately not `needs: [release]`: a matrix that failed on the mirror
    # still published GHCR, and a matrix that resolved to nothing published
    # nothing at all -- in both cases the mirror is the part that can still be
    # brought up to the registry the plan reads. `!cancelled()` rather than
    # `always()` because a run somebody stopped is not a run that should be
    # writing a registry behind them.
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.validate.result == 'success' && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (optional mirror)
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy what GHCR serves correctly to the Docker Hub mirror
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
          NAMESPACE: ${{ inputs.namespace || 'muffetlab' }}
          ENTRY: ${{ needs.guard.outputs.entry }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          # The repair list is the same resolver read as the matrix's, so it is
          # authenticated the same way; a private-or-deleted package answers it
          # rather than refusing it.
          REGISTRY_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "No Docker Hub mirror secrets on this repository, so there is no <user>/php repository to bring up to GHCR and nothing here was skipped by accident. GHCR itself is unaffected: the names this job would have copied are published there by the matrix."
            exit 0
          fi
          primary="ghcr.io/${NAMESPACE}/php"
          mirror="${DOCKERHUB_USERNAME}/php"
          # The list is the resolver's answer, not a list this step composes. It
          # already knows which names it read, compared with the manifest, and
          # found equal on both variants and every architecture, and it spells
          # the exact and floating names -- composing them a second way here is
          # how a mirror ends up pointed at a name the plan never checked.
          if ! repair_json="$(./tools/release-plan.sh --scope "$SCOPE" \
              --namespace "$NAMESPACE" --repair)"; then
            printf '%s\n' "$repair_json"
            echo "::error::the release plan could not be read for the mirror repair of '${SCOPE}'; nothing was copied. A registry this step cannot read is not a reason to guess at a mirror"
            exit 1
          fi
          printf '%s\n' "$repair_json" | jq -e 'type == "array"' >/dev/null || {
            echo "::error::the repair list is not a JSON array: $repair_json"
            exit 1; }
          count="$(printf '%s' "$repair_json" | jq 'length')"
          if [ "$count" = 0 ]; then
            echo "::notice::entry $ENTRY (${SCOPE}): the primary served no name this run could verify as current, so the mirror has nothing it is allowed to copy. This is not a claim that the mirror is correct -- an unverified name is not a name to copy -- and a mirror that is wrong in that state stays wrong until the primary publishes something the plan has checked."
            exit 0
          fi
          # What a name *is*, reduced to what a puller resolves: one "os/arch
          # child-digest" line per real platform, sorted. Attestation entries
          # are dropped because buildx attaches provenance and SBOM manifests
          # with a platform of unknown/unknown, they are not architectures, and
          # GitHub's attestation storage does not exist on the mirror --
          # comparing them would call every copied image a difference. A tag
          # that is a single manifest rather than a list is named as one, so the
          # two shapes cannot read as equal to each other.
          content_of() { # <raw-manifest-json>
            printf '%s' "$1" | jq -r '
              if (.manifests | type) == "array" then
                ([.manifests[]? | select(.platform != null)
                  | select((.platform.architecture // "unknown") != "unknown")
                  | "\(.platform.os)/\(.platform.architecture) \(.digest)"] | sort | join("\n"))
              else "single \(.config.digest // "unreadable")" end'
          }
          copied=0
          equal=0
          incomplete=0
          foreign_count=0
          failed=0
          while IFS=$'\t' read -r series variant exact floating; do
            [ -n "$exact" ] || continue
            echo "Repair: ${series} ${variant} -> ${exact} (floating ${floating})"
            # Read the primary first, and read it live: this job runs after the
            # matrix, so a name the plan called next may be one the matrix
            # published since. Nothing is copied from a source this step cannot
            # read now.
            if ! praw="$(docker buildx imagetools inspect --raw "${primary}:${exact}" 2>&1)"; then
              printf '%s\n' "$praw" | tail -n 3
              echo "::error::${primary}:${exact} is on the repair list but the primary no longer serves it, so nothing was copied for it"
              failed=$((failed + 1))
              continue
            fi
            want="$(content_of "$praw")"
            if mraw="$(docker buildx imagetools inspect --raw "${mirror}:${exact}" 2>&1)"; then
              have="$(content_of "$mraw")"
              # A name that exists but differs is two facts, not one, and the
              # boundary between them decides nothing about the revision but
              # everything about the words this job says: a mirror holding a
              # child GHCR does not serve carries a different build, while a
              # mirror holding only a subset of GHCR's platforms holds an
              # incomplete copy of this one. Both are refused -- an existing tag
              # is not patched in place and an exact published name is never
              # rewritten, on either registry -- but the human deleting the tag
              # should be told which of the two they are deleting. comm reads
              # the two sorted line sets directly: lines only in the mirror's
              # content are foreign, lines only in the primary's are what the
              # copy is missing.
              foreign="$(comm -23 <(printf '%s\n' "$have") <(printf '%s\n' "$want") | sed '/^$/d')"
              owed="$(comm -13 <(printf '%s\n' "$have") <(printf '%s\n' "$want") | sed '/^$/d')"
              if [ -n "$foreign" ]; then
                echo "::error::${mirror}:${exact} already exists and carries images ${primary}:${exact} does not -- GHCR has [$(printf '%s' "$want" | tr '\n' ';')], the mirror has [$(printf '%s' "$have" | tr '\n' ';')]. Nothing was written. An exact published name is never rewritten, so the mirror's snapshot stays as it is, and the plan will not publish beside it either, because GHCR is the registry the plan reads and GHCR is correct. This is the one gap a release run cannot close: delete ${mirror}:${exact} in Docker Hub's package settings, then re-run the same scope -- the next pass finds the name free and copies GHCR's into it. That is a repair of the mirror, not a rebuild, and it moves no revision."
                foreign_count=$((foreign_count + 1))
                continue
              fi
              if [ -n "$owed" ]; then
                echo "::error::${mirror}:${exact} exists but is an incomplete copy of ${primary}:${exact} -- the mirror is missing [$(printf '%s' "$owed" | tr '\n' ';')]. Nothing was written: an existing tag is not patched in place, and rewriting the name to a wider list is the same act as rewriting it to a different image. Delete ${mirror}:${exact} in Docker Hub's package settings, then re-run the same scope -- the next pass finds the name free and re-syncs it from GHCR whole. That is a repair of the mirror, not a rebuild, and it moves no revision."
                incomplete=$((incomplete + 1))
                continue
              fi
              echo "Verified ${mirror}:${exact} carries the same images as ${primary}:${exact}; nothing was written for that name."
              equal=$((equal + 1))
            else
              if ! out="$(docker buildx imagetools create -t "${mirror}:${exact}" "${primary}:${exact}" 2>&1)"; then
                printf '%s\n' "$out" | tail -n 3
                echo "::error::could not copy ${primary}:${exact} to ${mirror}:${exact}: $(printf '%s\n' "$out" | tail -n 3 | tr '\n' ' ')"
                failed=$((failed + 1))
                continue
              fi
              echo "Copied ${primary}:${exact} to ${mirror}:${exact} -- no build and no re-tag of this run's digests: the mirror took GHCR's image."
              copied=$((copied + 1))
            fi
            # The floating name is the moving one, so it is checked against the
            # exact name rather than remembered: a mirror whose snapshot is
            # right and whose <minor>-<variant> still points one revision back
            # is a mirror that reads stale to everyone who does not pin.
            if fraw="$(docker buildx imagetools inspect --raw "${mirror}:${floating}" 2>&1)" &&
              [ "$(content_of "$fraw")" = "$want" ]; then
              echo "${mirror}:${floating} already resolves to it."
            elif ! out="$(docker buildx imagetools create -t "${mirror}:${floating}" "${mirror}:${exact}" 2>&1)"; then
              printf '%s\n' "$out" | tail -n 3
              echo "::error::could not point ${mirror}:${floating} at ${mirror}:${exact}: $(printf '%s\n' "$out" | tail -n 3 | tr '\n' ' ')"
              failed=$((failed + 1))
            else
              echo "Pointed ${mirror}:${floating} at ${mirror}:${exact}."
            fi
          done < <(printf '%s' "$repair_json" | jq -r '.[] | [.series, .variant, .exact, .floating] | @tsv')
          printf 'mirror-repair: %d copied from %s, %d already equal, %d incomplete copies, %d carrying images GHCR does not, %d failures\n' \
            "$copied" "$primary" "$equal" "$incomplete" "$foreign_count" "$failed"
          if [ "$incomplete" != 0 ] || [ "$foreign_count" != 0 ] || [ "$failed" != 0 ]; then
            echo "::error::the mirror is not up to ${primary}: ${incomplete} exact name(s) are incomplete copies, ${foreign_count} carry images GHCR does not, and ${failed} name(s) could not be read or written. The images GHCR serves are unaffected, and no revision moved; the lines above name which tag needs which hand"
            exit 1
          fi

  # The Docker Hub mirror's Overview, once per release run. It is one document
  # for the whole <user>/php repository rather than one per series, so it cannot
  # live in the matrix: a version=all run has eight legs, and eight identical
  # PATCH calls would report one release as eight -- and if leg three failed
  # while leg seven succeeded, the document would be written by whichever
  # finished last. One job, after the matrix, is the honest version of "the
  # Overview matches this release".
  #
  # A README-only change still goes through tools/sync-dockerhub-readme.yml,
  # which exists so the Overview can be re-synced without republishing an image.
  mirror-readme:
    needs: [guard, plan, release]
    # Only after a release that actually published: a failed matrix must not
    # advertise a half-published set of images, and a run whose plan resolved to
    # nothing published nothing, so its Overview is already current.
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Sync the Docker Hub mirror's Overview once for this release
        # continue-on-error because by now the tags and layers are published: a
        # red step at the tail of a good release invites someone to re-run the
        # workflow, and re-running it re-pushes images to fix a documentation
        # pane. The script does not soften its own outcome -- it prints a
        # ::error:: naming the HTTP code and whether the token or the repository
        # is at fault.
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
          DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
          RELEASE: ${{ needs.guard.outputs.release }}
          ENTRY: ${{ needs.guard.outputs.entry }}
          LEGS: ${{ needs.plan.outputs.legs }}
        run: |
          set -eu
          # The mirror test is in the shell, not the "if:", on purpose. GitHub
          # does not give a step condition the secrets context (only
          # env/vars/steps/matrix), so an expression here could not prove the
          # secret exists -- it would read an unset env var as the empty string
          # and skip quietly, which is the same answer as "no mirror
          # configured". Saying which of the two happened is worth a line of
          # output, and the line below is only reached with both set.
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "No Docker Hub mirror secrets on this repository, so there is no <user>/php repository to write an Overview for, and nothing here was skipped by accident. ${RELEASE} published ${LEGS} series to GHCR only, each at the revision the registry said was next for its PHP version."
            exit 0
          fi
          echo "One Overview call for the whole release run (entry ${ENTRY}, source release ${RELEASE}, ${LEGS} series published); this is that call."
          ./tools/sync-dockerhub-readme.sh

  # GHCR packages are created private on first push. GITHUB_TOKEN cannot change
  # package visibility, so this step uses an optional GHCR_PAT secret (classic
  # PAT with write:packages). Without the secret it skips and prints the manual
  # path: repository Packages page -> Package settings -> Change visibility ->
  # Public.
  #
  # Because that skip passes the job, a green package-visibility result says
  # nothing about whether anyone can pull what the release just wrote -- so a
  # second step asks the registry with no credentials at all and reports what an
  # anonymous reader actually sees. It is reporting, not a gate: the tags and
  # layers are already published by the time this runs, and an unreadable
  # package is fixed in package settings, not by failing a release.
  package-visibility:
    # The matrix job, not one series: a run publishes the series it selects, and
    # a skipped dependency skips its dependents -- so depending on a single
    # series' job would have hidden this check from every release that did not
    # include it. One matrix job now covers both run types, and its result is
    # the release's result: success means every selected series published on
    # every leg, so an empty or failed release never reaches here to report on
    # nothing.
    needs: [release]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate namespace input
        env:
          NAMESPACE: ${{ inputs.namespace || 'muffetlab' }}
        run: |
          # One path segment: the published ref is <registry>/<namespace>/php,
          # so a slash or a dot-only value would silently produce a bad name.
          if ! printf '%s' "$NAMESPACE" | grep -Eq '^[a-zA-Z0-9._-]+$'; then
            echo "::error::invalid namespace '$NAMESPACE' (expected a GHCR owner, e.g. muffetlab)"
            exit 1
          fi

      # The packages API resource name is not the registry path after ghcr.io/:
      # the package page for the leaf form answers 200 and the one for the slash
      # form answers 404,
      #   https://github.com/users/muffetlab/packages/container/package/php        -> 200
      #   https://github.com/users/muffetlab/packages/container/package/muffetlab%2Fphp -> 404
      # so for this repository the API package name is `php`, and
      # `ghcr.io/muffetlab/php` is not the same string as the API resource name.
      # (The REST equivalent cannot serve as the witness: the packages API answers
      # 401 to every unauthenticated call, right or wrong name alike -- one reason
      # the step must not treat a status code as an explanation.)
      #
      # 404 from the packages API is deliberately ambiguous: wrong name, token
      # that cannot see the package, token belonging to a different account, or
      # a package under the other kind of owner all look identical. A
      # guess-and-PATCH step cannot tell those apart, so this step asks the API
      # what the owner has before it tries to change anything, confirms each
      # candidate by reading it back, and takes the visibility it reports. If
      # that read already says public there is nothing to PATCH and the correct
      # outcome is "already public", not an error. Both name forms stay in the
      # candidate list because a fork publishing a repository-scoped name really
      # does need the slash form.
      #
      # Failure here is reported, never fatal. The tags and layers are published
      # before this runs; a red job at the tail of a good release invites
      # someone to re-run or re-tag it, which republishes image tags to fix a
      # metadata toggle. The next step reads the registry back with no
      # credentials, so the log ends with what a consumer can actually do rather
      # than with this API's opinion.
      - name: Make GHCR package public (requires GHCR_PAT secret)
        env:
          PAT: ${{ secrets.GHCR_PAT }}
          NAMESPACE: ${{ inputs.namespace || 'muffetlab' }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          api="https://api.github.com"
          manual="GitHub repo -> Packages -> php -> Package settings -> Change visibility -> Public"
          if [ -z "$PAT" ]; then
            echo "::notice::GHCR_PAT secret not set - skipping visibility change."
            echo "::notice::Manual: ${manual}"
            exit 0
          fi
          # A package name can contain a slash; a URL path segment cannot. The
          # API wants it percent-encoded.
          enc() { printf '%s' "$1" | sed 's|/|%2F|g'; }
          # gh <method> <path> <outfile> [json-body] -> prints the HTTP code
          # only. A transport failure prints 000 rather than aborting the step,
          # because the answer to "did we reach the API" belongs in the report,
          # not in the job's exit status.
          gh() {
            if [ "$#" -ge 4 ]; then
              curl -sS --max-time 30 -o "$3" -w '%{http_code}' -X "$1" \
                -H "Authorization: Bearer $PAT" \
                -H "Accept: application/vnd.github+json" \
                -d "$4" "${api}$2" || echo 000
            else
              curl -sS --max-time 30 -o "$3" -w '%{http_code}' -X "$1" \
                -H "Authorization: Bearer $PAT" \
                -H "Accept: application/vnd.github+json" \
                "${api}$2" || echo 000
            fi
          }
          # The one field extraction needed: "key":"value". cut -f4 because the
          # matches are always "key":"value" quoted with ". No jq in this repo.
          jstr() { grep -o "\"$1\":\"[^\"]*\"" "$2" 2>/dev/null | head -1 | cut -d'"' -f4 || true; }

          # Who is this token? A 404 below is meaningless without knowing
          # whether the caller is even the package owner -- and fine-grained
          # PATs send no X-OAuth-Scopes header at all, which is itself worth
          # printing.
          hdrs="$(mktemp)"; who="$(mktemp)"
          curl -sS --max-time 30 -D "$hdrs" -o "$who" -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" "$api/user" >/dev/null || true
          login="$(jstr login "$who")"
          scopes="$(grep -i '^x-oauth-scopes:' "$hdrs" | tr -d '\r\n' | sed 's/^[^:]*: *//' || true)"
          echo "GHCR_PAT authenticates as: ${login:-<no /user identity returned>}"
          echo "X-OAuth-Scopes: ${scopes:-<header absent -- fine-grained PATs omit it; a classic PAT needs write:packages>}"
          if [ -n "$login" ] && [ "$login" != "$OWNER" ]; then
            echo "::warning::the token's account '$login' is not the repository owner '$OWNER'. /users/<owner> package endpoints only accept the owner's own token, so a cross-account PAT 404s however correct the package name is."
          fi

          # Candidate names, most likely first: the leaf, then the full registry
          # path. Both shapes exist in the wild -- user/org-scoped containers
          # are named by their last segment, repository-scoped ones by
          # <owner>/<name> -- and the slash form is the one that measured 404
          # here, so it is tried second and never assumed.
          candidates="php ${NAMESPACE}/php"

          # What does this token think the owner has? Printed for the log, and
          # the only honest answer to "is it the name or the token that is
          # wrong".
          for scope in "users/${OWNER}" "orgs/${OWNER}"; do
            code="$(gh GET "/${scope}/packages?package_type=container&per_page=100" /tmp/ghcr-pk-list.json)"
            if [ "$code" = "200" ]; then
              echo "  ${scope} container packages: $(grep -o '"name":"[^"]*"' /tmp/ghcr-pk-list.json | sed 's/^"name":"//; s/"$//' | sort -u | tr '\n' ' ')"
            else
              echo "  ${scope}/packages -> HTTP ${code}"
            fi
          done

          tried=""
          for scope in "users/${OWNER}" "orgs/${OWNER}"; do
            for name in $candidates; do
              path="/${scope}/packages/container/$(enc "$name")"
              code="$(gh GET "$path" /tmp/ghcr-pk.json)"
              tried="${tried}\n  GET ${path} -> ${code}"
              [ "$code" = "200" ] || continue
              vis="$(jstr visibility /tmp/ghcr-pk.json)"
              echo "Resolved package resource: ${scope} / ${name} (visibility: ${vis:-unknown})"
              if [ "$vis" = "public" ]; then
                echo "GHCR package ${name} is already public; no visibility change sent."
                exit 0
              fi
              code="$(gh PATCH "${path}/visibility" /tmp/ghcr-pk.json '{"visibility":"public"}')"
              tried="${tried}\n  PATCH ${path}/visibility -> ${code}"
              case "$code" in
                200|204)
                  echo "GHCR package ${name} is public (HTTP ${code})"
                  exit 0 ;;
                *)
                  echo "::warning::visibility change refused for ${name} under ${scope} (HTTP ${code}): $(tr -d '\n' < /tmp/ghcr-pk.json)" ;;
              esac
            done
          done
          printf "%b" "Tried:${tried}\n"
          echo "::warning::no GHCR package this token could reach matches the published image (${NAMESPACE}/php), so this step changed nothing. The anonymous registry read-back in the next step says whether that matters to a reader. Manual: ${manual}"

      # Reported, never assumed. The visibility step above exits 0 whether it
      # flipped the package, skipped because GHCR_PAT is absent, or was told the
      # name lives under another owner -- so "the job is green" has never been
      # evidence that a reader can pull the release. This asks the registry the
      # same question a stranger asks it: an unauthenticated token for
      # scope=repository:<namespace>/php:pull, then GET
      # /v2/<namespace>/php/tags/list. A public package answers 200 with its
      # tags; a repository no one can read answers with no token at all and HTTP
      # 403 -- so the two outcomes are distinguishable without any secret here.
      # No jq and no python, because the workflows in this repo are bash+awk
      # only, and the only thing parsed is the token field.
      - name: Confirm an anonymous reader can pull the published address
        if: ${{ !cancelled() }}
        env:
          NAMESPACE: ${{ inputs.namespace || 'muffetlab' }}
        run: |
          set -eu
          repo="${NAMESPACE}/php"
          manual="GitHub repo -> Packages -> php -> Package settings -> Change visibility -> Public (or set the GHCR_PAT secret and the step above does it)"
          tok="$(curl -sS --max-time 30 \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" \
            | grep -o '"token":"[^"]*"' | sed 's/^"token":"//; s/"$//' || true)"
          if [ -z "$tok" ]; then
            echo "::warning::ghcr.io issued no anonymous pull token for ${repo}, so nothing here proves a stranger can pull it. ${manual}"
            exit 0
          fi
          body="$(mktemp)"
          # A transport failure still leaves -w printing 000, so the fallback is
          # an empty-string default rather than a second || echo (which turned
          # the message into "HTTP 000000" when stubbed).
          code="$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $tok" "https://ghcr.io/v2/${repo}/tags/list" || true)"
          code="${code:-000}"
          if [ "$code" = "200" ]; then
            echo "Anonymous read of ${repo}: HTTP ${code}; tags a stranger can list: $(tr -d ' \n' < "$body")"
          else
            echo "::warning::${repo} is not readable anonymously (HTTP ${code}); the release's tags exist but docker pull without credentials fails. ${manual}"
          fi
